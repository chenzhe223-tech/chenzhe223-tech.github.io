name: WORLD/TOON 3.0 and 4.0 production regression checks
on:
  push:
    branches: [main]
    paths:
      - 'comic-studio/**'
      - '.github/workflows/worldtoon-v3-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing 3.0 functional contracts
        run: node comic-studio/tests/worldtoon-v3-smoke.cjs
      - name: Verify 4.0 unified production journey and author gates
        run: node comic-studio/tests/worldtoon-v4-smoke.cjs
      - name: Test DeepSeek expansion consent, timeout and error recovery
        run: node comic-studio/tests/worldtoon-deepseek-smoke.cjs
