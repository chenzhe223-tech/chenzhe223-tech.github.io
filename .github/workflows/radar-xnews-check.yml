name: X News adapter tests

on:
  pull_request:
    paths:
      - 'radar/scripts/xnews_sources.py'
      - 'radar/scripts/build_daily.py'
      - 'radar/tests/test_xnews_sources.py'
      - '.github/workflows/radar-xnews-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xnews-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check X News RSS adapter contracts (offline)
        run: python -m unittest discover -s radar/tests -p 'test_xnews_sources.py' -v
