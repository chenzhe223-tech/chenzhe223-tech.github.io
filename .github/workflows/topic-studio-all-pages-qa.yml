name: Topic Studio - All Pages Functional QA

on:
  push:
    paths:
      - "topic-studio/index.html"
      - "topic-studio/opportunity-engine.js"
      - "topic-studio/xnews-discovery.js"
      - "topic-studio/topic-pool-reliability.js"
      - "topic-studio/workspace-layout-guard-v5.css"
      - "topic-studio/productivity-desk-v1.css"
      - "topic-studio/productivity-desk-v1.js"
      - "topic-studio/hotspot-ranker.js"
      - "topic-studio/hotspot-recommender.js"
      - "topic-studio/hotspot-recommender.css"
      - "topic-studio/data/hotspot-signals.json"
      - "topic-studio/tests/hotspot-recommender.test.cjs"
      - "topic-studio/tests/all-pages-browser-smoke.py"
      - ".github/workflows/topic-studio-all-pages-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topic-studio-all-pages-ui-qa
  cancel-in-progress: false

jobs:
  test-all-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium test runner
        run: |
          python -m pip install --quiet playwright==1.56.0
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Verify deterministic Top-10 ranking
        run: node topic-studio/tests/hotspot-recommender.test.cjs
      - name: Test all eight pages and cross-module workflows
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/topic-studio-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          python topic-studio/tests/all-pages-browser-smoke.py
      - name: Upload synthetic QA screenshots and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic-studio-all-pages-qa
          path: |
            topic-studio/qa/all-pages-ui-latest.json
            topic-studio/qa/page-desktop-*.png
            topic-studio/qa/page-mobile-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Record passing or failing QA result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f topic-studio/qa/all-pages-ui-latest.json || exit 0
          git config user.name "DAVYLAB Topic Studio QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topic-studio/qa/all-pages-ui-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "test(topic-studio): all-page browser QA result [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
