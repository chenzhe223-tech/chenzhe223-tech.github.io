name: Topic Studio · Refresh XNews discovery index

on:
  push:
    paths:
      - "topic-studio/index.html"
      - "topic-studio/discover-layout-v3.css"
      - "topic-studio/discover-layout-v3.js"
      - "topic-studio/opportunity-engine.js"
      - "topic-studio/xnews-discovery.css"
      - "topic-studio/tests/discover-layout.test.cjs"
      - "topic-studio/xnews-discovery.js"
      - "topic-studio/scripts/sync_xnews.py"
      - "topic-studio/scripts/sync_overseas.py"
      - "topic-studio/scripts/sync_finance.py"
      - "topic-studio/data/overseas-discovery.json"
      - "topic-studio/tests/test_overseas_sync.py"
      - "topic-studio/tests/test_xnews_sync.py"
      - "topic-studio/tests/xnews-integration.test.cjs"
      - ".github/workflows/topic-studio-xnews-sync.yml"
  schedule:
    # 09:25 Beijing/Singapore time, after XNews's suggested 08:00 daily update.
    - cron: "25 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: davylab-topic-studio-xnews
  cancel-in-progress: false

jobs:
  sync-xnews-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout primary repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify responsive discovery layout and existing controls
        run: node topic-studio/tests/discover-layout.test.cjs
      - name: Test source merge, adoption, fallback and escaped rendering
        run: node topic-studio/tests/xnews-integration.test.cjs
      - name: Test metadata contracts before sync
        run: python -m unittest discover -s topic-studio/tests -p 'test_xnews_sync.py' -v
      - name: Test independent overseas original-source parser
        run: python -m unittest discover -s topic-studio/tests -p 'test_overseas_sync.py' -v
      - name: Fetch public XNews article-index metadata
        id: xnews
        continue-on-error: true
        run: python topic-studio/scripts/sync_xnews.py
      - name: Fetch independently attributed overseas original-source headlines
        id: overseas
        continue-on-error: true
        run: python topic-studio/scripts/sync_overseas.py
      - name: Validate new snapshot
        run: python -m unittest discover -s topic-studio/tests -p 'test_xnews_sync.py' -v
      - name: Commit index only if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAVYLAB Topic Studio Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topic-studio/data/xnews-discovery.json topic-studio/data/overseas-discovery.json
          if ! git diff --cached --quiet; then
            git commit -m "data(topic-studio): refresh public XNews discovery metadata [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          else
            echo "No new upstream metadata (no synthetic articles)."
          fi
      - name: Fail visibly if both source pipelines failed after preserving snapshots
        if: steps.xnews.outcome == 'failure' && steps.overseas.outcome == 'failure'
        run: |
          echo "::error::Both overseas source refreshes failed. Last known good snapshots preserved."
          exit 1
