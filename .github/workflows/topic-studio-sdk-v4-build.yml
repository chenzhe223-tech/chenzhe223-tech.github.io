name: DAVYLAB CloudBase Web SDK pinned vendor build

on:
  push:
    paths:
      - "topic-studio/cloudbase/sdk-entry-v4.mjs"
      - ".github/workflows/topic-studio-sdk-v4-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topic-studio-sdk-v4-vendor
  cancel-in-progress: false

jobs:
  bundle-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned SDK and bundler without credentials
        run: npm install --no-audit --no-fund --no-save --no-package-lock @cloudbase/js-sdk@4.1.0 esbuild@0.25.12
      - name: Build self-hosted CloudBase web SDK module
        run: |
          mkdir -p topic-studio/cloudbase/vendor
          ./node_modules/.bin/esbuild topic-studio/cloudbase/sdk-entry-v4.mjs --bundle --minify --platform=browser --format=esm --target=es2020 --outfile=topic-studio/cloudbase/vendor/cloudbase-sdk-v4.mjs
          test -s topic-studio/cloudbase/vendor/cloudbase-sdk-v4.mjs
          node -e "const fs=require('fs'); const s=fs.readFileSync('topic-studio/cloudbase/vendor/cloudbase-sdk-v4.mjs','utf8');if(s.length<5000||!s.includes('export'))process.exit(1)"
      - name: Commit self-hosted vendor SDK when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAVYLAB SDK Vendor Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topic-studio/cloudbase/vendor/cloudbase-sdk-v4.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build(topic-studio): vendor pinned CloudBase Web SDK v4.1.0 [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
