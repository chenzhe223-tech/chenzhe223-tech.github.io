name: WorldToon navigation live origin diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/worldtoon-nav-origin-diagnostic.yml']
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare live Worker, GitHub raw, and GitHub Pages HTML
        shell: python
        run: |
          import urllib.request,time,hashlib
          urls=[
           'https://worldtoon.chenzhe223.workers.dev/',
           'https://worldtoon.chenzhe223.workers.dev/?nav-diagnostic=20261110',
           'https://raw.githubusercontent.com/chenzhe223-tech/chenzhe223-tech.github.io/main/comic-studio/index.html',
           'https://raw.githubusercontent.com/chenzhe223-tech/chenzhe223-tech.github.io/main/comic-studio/index.html?nav-diagnostic=20261110',
           'https://chenzhe223-tech.github.io/comic-studio/'
          ]
          for url in urls:
           try:
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'WorldToon-Navigation-Check'})
            with urllib.request.urlopen(req,timeout=25) as r:
             body=r.read(100000).decode('utf-8','replace')
             print({'url':url,'status':r.status,'bytes':len(body),'sha256':hashlib.sha256(body.encode()).hexdigest(),
               'nav_group':('data-nav-group="handoff"' in body),'children':('nav-children' in body),
               'director':('href="#/director"' in body),'cache_control':r.headers.get('Cache-Control'),
               'age':r.headers.get('Age'),'last_modified':r.headers.get('Last-Modified'),
               'server':r.headers.get('server')})
           except Exception as ex:print('ERROR',url,str(ex)[:280])
