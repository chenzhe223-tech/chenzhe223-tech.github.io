name: WORLD/TOON live Comic Engine smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'comic-studio/**'
      - '.github/workflows/worldtoon-live-comic.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify live Worker endpoints and four-skill script
        shell: python
        run: |
          import json, urllib.request, urllib.error, time
          base='https://worldtoon.chenzhe223.workers.dev'
          def read(path,timeout=22):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={'User-Agent':'WorldToon-Live-QA/1.0','Cache-Control':'no-cache'}),timeout=timeout) as resp:
                  return resp.status,resp.read(1600000)
          def expect_json(path):
              status,body=read(path)
              assert status==200, (path,status,body[:200])
              return json.loads(body)
          h=expect_json('/health')
          assert h.get('ok') is True,h
          assert h.get('version')=='4.6.0',h
          assert h.get('features',{}).get('script') is False,h
          assert h.get('features',{}).get('image') is False,h
          print('health OK; AI direct generation remains disabled')
          start=time.perf_counter()
          catalog=expect_json('/api/comic/catalog?source=all&limit=500')
          elapsed=round((time.perf_counter()-start)*1000)
          assert catalog.get('schema')=='davylab.worldtoon.catalog.v3',catalog.get('schema')
          assert catalog.get('method')=='d1_snapshot_read',catalog
          assert len(catalog.get('stats',[]))==8,catalog.get('stats')
          assert catalog.get('fact_checked') is False,catalog
          assert catalog.get('ready'),('Scheduled or cold-start collection has not materialized',catalog.get('stats'))
          assert len(catalog.get('items',[]))>=100,('Cached catalog must contain real source items',len(catalog.get('items',[])))
          expected={'news','hackernews','arxiv','classics','history','literary_series','nobel_literature','academic_events'}
          assert expected=={x['id'] for x in catalog.get('stats',[]) if x.get('ready')},catalog.get('stats')
          assert any(x.get('category')=='经典故事' for x in catalog['items']),'All-source catalog must include classics'
          assert any(x.get('category')=='历史脑洞' for x in catalog['items']),'All-source catalog must include history'
          assert any(x.get('category')=='世界文学' for x in catalog['items']),'All-source catalog must include literature series'
          assert any(x.get('category')=='诺奖文学' for x in catalog['items']),'All-source catalog must include Nobel works'
          assert any(x.get('category')=='世界学术活动' for x in catalog['items']),'All-source catalog must include academic events'
          print('D1 snapshot catalog HTTP:',elapsed,'ms,ready:',catalog.get('ready'),'sources:',catalog.get('stats'))
          # V3 resource proof: the deployed Worker must actually expose both new assets.
          status,head=read('/')
          assert status==200 and b'style-v3.js' in head and b'style-v3.css' in head
          status,styles_js=read('/style-v3.js?v=3.3.0')
          assert status==200 and b'Chinese Historical Epic' in styles_js and b'Japanese Luminous Anime' in styles_js
          assert b'not_generated' in styles_js and b'not_licensed' in styles_js
          status,styles_css=read('/style-v3.css?v=3.3.0')
          assert status==200 and b'wt-v3-grid' in styles_css and b'max-width:650px' in styles_css
          assert b'wt-v3-quick-grid' in styles_css and b'wt-v3-allstyles' in styles_css
          print('V3 live 25-style atlas, compact selector JS/CSS HTTP 200; absent real images explicitly labeled')
          status,src=read('/comic-engine.js')
          assert status==200 and b'wtComicEngine' in src and b'TT_AutoManga' in src
          print('four-skill workshop JavaScript is reachable')
          for resource,needle in [('/creative-director.js',b'wtDirector'),('/creative-pilot.js',b'wtPilot'),('/creative-director.css',b'director-styles')]:
              for attempt in range(6):
                  try:
                      code,body=read(resource,timeout=14)
                      assert code==200 and needle in body,(resource,code,body[:100])
                      break
                  except (urllib.error.HTTPError,TimeoutError,AssertionError):
                      if attempt==5:raise
                      time.sleep(5)
              print('creative preproduction resource live:',resource)
          unauth=urllib.request.Request(base+'/api/archive/pilot-approval',data=b'{}',method='POST',
                       headers={'Content-Type':'application/json','User-Agent':'WorldToon-Live-QA/1.0'})
          try:
              urllib.request.urlopen(unauth,timeout=14)
          except urllib.error.HTTPError as ex:
              assert ex.code in (401,403),'Unauthorized pilot approval must be forbidden'
              print('owner-only pilot approval returns',ex.code)
          else:raise AssertionError('Anonymous users must not be able to approve pilot samples')

          result=expect_json('/api/comic/discover?source=hackernews&limit=8')
          assert isinstance(result.get('items'),list) and result['items'],result
          assert all(v.get('source_id')=='hackernews' and v.get('verification_status')=='pending_research' for v in result['items'])
          assert all(v.get('url','').startswith('https://') for v in result['items'])
          assert len(result['items'])<=8
          print('Hacker News source verified online:',len(result['items']),'candidates')
          for feed in ('arxiv','news'):
              try:
                  result2=expect_json('/api/comic/discover?source='+feed+'&limit=5')
                  assert result2.get('items') and all(x.get('source_id')==feed for x in result2['items'])
                  print(feed,'online candidates:',len(result2['items']))
              except (urllib.error.HTTPError,TimeoutError) as ex:
                  print(feed,'temporarily unavailable (non-blocking):',str(ex)[:160])
          combined=expect_json('/api/comic/discover?source=all&limit=12')
          assert combined.get('items') and combined.get('counts')
          print('aggregated-source status:',combined['counts'])
          try:
              read('/api/comic/discover?source=invalid')
          except urllib.error.HTTPError as ex:
              assert ex.code==400
              print('unknown-source validation OK')
          else:raise AssertionError('invalid discovery source must not be accepted')
          status,visual_js=read('/comic-visuals.js')
          assert status==200 and b'wtVisualStudio' in visual_js
          classic=expect_json('/api/comic/discover?source=classics&limit=40')
          assert len(classic.get('items',[]))>=30,('Not enough classic leads',classic)
          assert all(v.get('source_id')=='gutenberg' and v.get('rights_status')=='check_jurisdiction' for v in classic['items'])
          print('evergreen classics online:',len(classic['items']))
          try:
              history=expect_json('/api/comic/discover?source=history&limit=60')
              assert len(history.get('items',[]))>=10,('History catalog too small',history)
              assert all(v.get('source_id')=='wikidata' and v.get('verification_status')=='pending_research' for v in history['items'])
              print('historical concept leads online:',len(history['items']))
          except (urllib.error.HTTPError,TimeoutError) as ex:
              print('live Wikidata transient failure (cached catalog is authoritative):',str(ex)[:150])
          museum=expect_json('/api/comic/visuals?q=portrait')
          assert len(museum.get('items',[]))>=1,('No licensed museum references',museum)
          assert all(v.get('license')=='CC0' and v.get('rights_verified') is True for v in museum['items'])
          print('CC0 museum visual references online:',len(museum['items']),'sources',museum.get('counts'))
          print('WORLD/TOON P0-P3 live endpoints, licensed artwork and model lock passed.')
          print('WORLD/TOON runtime source discovery and four-skill JS smoke passed.')
