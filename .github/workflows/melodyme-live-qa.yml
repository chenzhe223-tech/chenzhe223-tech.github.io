name: MelodyMe live deployment QA

on:
  push:
    branches: ["main"]
    paths:
      - "melodyme/**"
      - "scripts/melodyme-live-qa.cjs"
      - ".github/workflows/melodyme-live-qa.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for a successful Pages deployment containing this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Waiting for a successful Pages deployment that contains $GITHUB_SHA"
          for attempt in $(seq 1 40); do
            RUNS="$(gh run list --workflow "pages.yml" --branch main --json databaseId,status,conclusion,headSha --limit 20)"
            PAGES_SHA="$(echo "$RUNS" | jq -r '[.[] | select(.status == "completed" and .conclusion == "success")][0].headSha // empty')"
            RUN_ID="$(echo "$RUNS" | jq -r '[.[] | select(.status == "completed" and .conclusion == "success")][0].databaseId // empty')"
            if [ -n "$PAGES_SHA" ]; then
              RELATION="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$PAGES_SHA" --jq .status)"
              echo "Successful Pages run $RUN_ID at $PAGES_SHA; commit relation: $RELATION"
              if [ "$RELATION" = "ahead" ] || [ "$RELATION" = "identical" ]; then
                exit 0
              fi
            else
              echo "No successful Pages deployment visible yet (attempt $attempt)"
            fi
            sleep 15
          done
          echo "Timed out waiting for a successful Pages deployment containing this commit"
          exit 1
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify deployed MelodyMe route and user flow
        env:
          MELODYME_URL: https://chenzhe223-tech.github.io/melodyme/
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          echo "Verifying production after Pages deployment for commit $EXPECTED_COMMIT"
          node scripts/melodyme-live-qa.cjs
      - name: Upload live QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melodyme-live-qa
          path: melodyme-live-results/
          if-no-files-found: warn
          retention-days: 14
