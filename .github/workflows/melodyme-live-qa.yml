name: MelodyMe live deployment QA

on:
  workflow_run:
    workflows: ["Deploy DAVYLAB to GitHub Pages"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

jobs:
  live-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify deployed MelodyMe route and user flow
        env:
          MELODYME_URL: https://chenzhe223-tech.github.io/melodyme/
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Verifying production after Pages deployment for commit $EXPECTED_COMMIT"
          node scripts/melodyme-live-qa.cjs
      - name: Upload live QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melodyme-live-qa
          path: melodyme-live-results/
          if-no-files-found: warn
          retention-days: 14
