name: MelodyMe live deployment QA

on:
  push:
    branches: ["main"]
    paths:
      - "melodyme/**"
      - "scripts/melodyme-live-qa.cjs"
      - ".github/workflows/melodyme-live-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify live MelodyMe route and user flow
        env:
          MELODYME_URL: https://chenzhe223-tech.github.io/melodyme/
        run: node scripts/melodyme-live-qa.cjs
      - name: Upload live QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melodyme-live-qa
          path: melodyme-live-results/
          if-no-files-found: warn
          retention-days: 14
