name: Topic Studio smoke tests
on:
  push:
    branches: [main]
    paths:
      - "topic-studio/**"
      - "radar/data/latest.json"
      - ".github/workflows/topic-studio-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-interaction-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Topic Studio discovery
        run: node topic-studio/tests/discover-smoke.cjs
