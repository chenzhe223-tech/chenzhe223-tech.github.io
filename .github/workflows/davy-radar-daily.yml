name: Build Davy Radar Daily
# Runs a private-key-safe Horizon + DeepSeek analysis before publishing the public daily JSON.

on:
  push:
    branches: [main]
    paths:
      - "radar/scripts/build_daily.py"
      - "radar/scripts/run_horizon.py"
      - "radar/scripts/news_image_match.py"
      - "radar/scripts/test_news_image_match.py"
      - "radar/skills/news-image-match/SKILL.md"
      - "radar/config/horizon.json"
      - ".github/workflows/davy-radar-daily.yml"
  schedule:
    # 23:30 UTC = 07:30 Beijing time (UTC+8)
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: davy-radar-daily
  cancel-in-progress: false

jobs:
  build-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout DAVYLAB
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test news image matching rules
        run: python -m unittest radar/scripts/test_news_image_match.py -v

      - name: Collect public AI news and rank Skills
        run: python radar/scripts/build_daily.py

      - name: Checkout Horizon (MIT)
        uses: actions/checkout@v4
        with:
          repository: Thysrael/Horizon
          ref: main
          path: horizon-src

      - name: Install Horizon dependencies
        working-directory: horizon-src
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run Horizon AI analysis (no notifications)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_DIR: ${{ github.workspace }}/horizon-src
        run: python radar/scripts/run_horizon.py

      - name: Match story-specific images (free sources first)
        run: python radar/scripts/news_image_match.py

      - name: Commit daily data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar/data/latest.json radar/data/history.json radar/data/archive/ radar/data/image-cache.json
          if git diff --cached --quiet; then
            echo "No daily data changes to commit."
          else
            git commit -m "Update Davy Radar daily intelligence"
            git push origin HEAD:main
          fi
