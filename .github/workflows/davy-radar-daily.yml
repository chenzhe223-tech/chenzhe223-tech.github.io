name: Build Davy Radar Daily

on:
  schedule:
    # 01:00 UTC = 09:00 Beijing time (UTC+8)
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: davy-radar-daily
  cancel-in-progress: false

jobs:
  build-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout DAVYLAB
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect AI news and rank public Skills
        run: python radar/scripts/build_daily.py

      - name: Commit daily data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar/data/latest.json radar/data/history.json radar/data/archive/
          if git diff --cached --quiet; then
            echo "No daily data changes to commit."
          else
            git commit -m "Update Davy Radar daily intelligence"
            git push origin HEAD:main
          fi
