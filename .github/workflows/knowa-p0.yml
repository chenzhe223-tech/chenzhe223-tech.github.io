name: KNOWA P0 checks
on:
  push:
    paths:
      - 'knowa/**'
      - '.github/workflows/knowa-p0.yml'
  pull_request:
    paths:
      - 'knowa/**'
      - '.github/workflows/knowa-p0.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knowa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: git diff --exit-code -- dist/worker.js
