name: MelodyMe prototype QA

on:
  pull_request:
    paths:
      - "melodyme/**"
      - "scripts/melodyme-live-qa.cjs"
      - ".github/workflows/melodyme-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate HTML and embedded JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          html = Path("melodyme/index.html").read_text(encoding="utf-8")
          class Checker(HTMLParser):
              def error(self, message):
                  raise AssertionError(message)
          parser = Checker(convert_charrefs=True)
          parser.feed(html)
          parser.close()
          for token in ['<!doctype html>', 'name="viewport"', 'id="start"', 'id="next"', 'data-node="0"', 'localStorage', '真实 AI', 'itunes.apple.com/search', 'id="musiccard"', 'id="autoStyle"', 'previewUrl', 'generateAlbumArt', 'aiCoverImage', 'inferSongFromStory', 'songAutoDetected', 'scoreMusicResult', 'country=CN', 'Encounter']:
              assert token.lower() in html.lower(), f"missing required token: {token}"
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "no inline JavaScript found"
          Path("/tmp/melodyme-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          print(f"HTML source checks passed; {len(html)} chars")
          PY
          node --check /tmp/melodyme-inline.js
      - name: Syntax-check browser QA script
        run: node --check scripts/melodyme-live-qa.cjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile journey smoke tests
        run: |
          python -m http.server 4173 --directory . >/tmp/melodyme-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const errors = [];
          const tinyPng = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADUlEQVR4nGP4z8AAAAMBAQDJ/pLvAAAAAElFTkSuQmCC', 'base64');
          const catalog = { results: [
            { trackName:'QA Preview Track', artistName:'QA Artist', collectionName:'QA Album', artworkUrl100:'https://is1-ssl.mzstatic.com/image/thumb/qa/100x100bb.jpg', previewUrl:'https://audio-ssl.itunes.apple.com/qa-preview.m4a', releaseDate:'2001-01-01T00:00:00Z' },
            { trackName:'QA No Preview Track', artistName:'QA Artist', collectionName:'QA Album', artworkUrl100:'https://is1-ssl.mzstatic.com/image/thumb/qa2/100x100bb.jpg', releaseDate:'2002-01-01T00:00:00Z' }
          ] };
          async function mockExternalServices(page) {
            let pollinationsMode = 'ok';
            let workerImageMode = 'ok';
            await page.route(/https:\/\/itunes\.apple\.com\/search.*/, route => route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(catalog)}));
            await page.route(/https:\/\/image\.pollinations\.ai\/.*/, route => pollinationsMode === 'ok'
              ? route.fulfill({status:200,contentType:'image/png',body:tinyPng})
              : route.fulfill({status:503,contentType:'text/plain',body:'mock image failure'}));
            await page.route(/melodyme-ai\.chenzhe223\.workers\.dev/, async route => {
              const payload = route.request().postDataJSON() || {};
              if (payload.action === 'generateAlbumArt') {
                return workerImageMode === 'ok'
                  ? route.fulfill({status:200,contentType:'image/png',body:tinyPng})
                  : route.fulfill({status:502,contentType:'application/json',body:JSON.stringify({error:'ai_image_generation_failed'})});
              }
              const results = {
                generateMemoryStory:{title:'QA Story',story:'A story generated for QA.',core_line:'A song, a memory.',memory_summary:'QA memory',poster_title:'QA poster',poster_subtitle:'QA subtitle',song_connection:'QA song connection'},
                generateSocialCopy:{copy:'QA social copy.'},
                planPosterComposition:{recommended_style:'电影雾光',palette:['#d8c8c8','#20384f'],composition:'Simple centered composition',typography:'Editorial serif',image_treatment:'Soft grain',text_density:'low',visual_motifs:['light'],reason_summary:'Matches the memory mood'}
              };
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,action:payload.action,model:'mock-test',result:results[payload.action] || {}})});
            });
            return {setPollinationsMode:v=>{pollinationsMode=v;},setWorkerImageMode:v=>{workerImageMode=v;}};
          }
          const page = await browser.newPage({viewport:{width:1280,height:900}});
          const mock = await mockExternalServices(page);
          await page.addInitScript(()=>{if(!sessionStorage.getItem('melodyme-test-clean')){localStorage.clear();sessionStorage.setItem('melodyme-test-clean','1')}});
          page.on('pageerror', e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/melodyme/',{waitUntil:'networkidle'});
          if (!(await page.title()).includes('MelodyMe')) throw new Error('title missing');
          await page.getByRole('button',{name:/开始探索/}).click();
          await page.locator('#next').click();
          if (!(await page.locator('#feedback').innerText())) throw new Error('empty story validation missing');
          await page.locator('#story').fill('毕业那天，我们在车站告别。这首歌让我想起那个夏天。');
          await page.locator('#next').click();
          await page.locator('[data-mood="怀念"]').click();
          await page.locator('#next').click();
          await page.locator('#songinput').fill('QA Preview Track');
          await page.locator('#searchMusic').click();
          await page.locator('.candidate').first().waitFor({state:'visible'});
          await page.locator('.candidate').nth(0).getByRole('button',{name:'选这首'}).click();
          const preview = page.locator('#musicresults audio');
          await preview.waitFor({state:'visible'});
          if (await preview.getAttribute('preload') !== 'none') throw new Error('preview preload must be none');
          if (await preview.getAttribute('src') !== 'https://audio-ssl.itunes.apple.com/qa-preview.m4a') throw new Error('preview URL must be the exact iTunes previewUrl');
          if (!(await page.locator('#musicresults').getByText('30 秒试听片段').count())) throw new Error('preview label missing');
          if (!(await preview.evaluate(el=>el.paused))) throw new Error('preview must not autoplay');
          await page.evaluate(()=>{const other=document.createElement('audio');other.id='qa-other-audio';other.pause=()=>{window.__qaOtherPaused=true};document.body.appendChild(other);document.querySelector('#musicresults audio').dispatchEvent(new Event('play'));});
          if (!(await page.evaluate(()=>window.__qaOtherPaused===true))) throw new Error('starting preview should pause other audio');
          await page.locator('.candidate').nth(1).getByRole('button',{name:'选这首'}).click();
          if (await page.locator('#musicresults audio').count() !== 0) throw new Error('player should hide when previewUrl is missing');
          if (!(await page.locator('#musicresults').getByText('该曲目暂无试听片段').count())) throw new Error('missing preview fallback text absent');
          await page.locator('.candidate').nth(0).getByRole('button',{name:'选这首'}).click();
          await page.locator('#next').click();
          await page.locator('#next').click();
          await page.locator('#results').waitFor({state:'visible'});
          if (await page.locator('.stylepick').count() !== 12) throw new Error('expected 12 poster styles');
          await page.locator('#aiCoverFrame').scrollIntoViewIfNeeded();
          await page.locator('#aiCoverStatus').waitFor({state:'visible'});
          await page.waitForFunction(()=>document.querySelector('#aiCoverStatus').textContent.includes('· Pollinations.ai'));
          if (!(await page.getByText('AI 生成封面（非真实专辑封面）').count())) throw new Error('AI cover disclosure missing');
          if (await page.locator('#aiCoverImage').getAttribute('loading') !== 'lazy') throw new Error('AI cover must lazy-load');
          if (await page.locator('#aiCoverImage').getAttribute('alt') !== 'AI 生成封面（非真实专辑封面）') throw new Error('AI cover alt/disclosure missing');
          await page.locator('[data-style="旧照片"]').click();
          mock.setPollinationsMode('fail');
          await page.locator('#regenerateCover').click();
          await page.waitForFunction(()=>document.querySelector('#aiCoverStatus').textContent.includes('· Cloudflare Workers AI 兜底'));
          await page.locator('[data-style="城市夜色"]').click();
          mock.setWorkerImageMode('fail');
          await page.locator('#regenerateCover').click();
          await page.waitForFunction(()=>document.querySelector('#aiCoverStatus').textContent.includes('AI 封面暂不可用'));
          if (!(await page.locator('#storycopy').inputValue()).includes('A story generated for QA.')) throw new Error('cover failure must preserve story copy');
          await page.locator('#autoStyle').click();
          if (!(await page.locator('.stylepick[aria-pressed="true"]').count())) throw new Error('style selection state missing');
          await page.locator('#storycopy').fill('可编辑的 QA 文案');
          await page.locator('#save').click();
          await page.getByRole('button',{name:/我的作品/}).click();
          if (!(await page.getByText('QA Preview Track').count())) throw new Error('save to collection failed');
          await page.reload();
          await page.getByRole('button',{name:/我的作品/}).click();
          if (!(await page.getByText('QA Preview Track').count())) throw new Error('local persistence failed');
          const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          await mockExternalServices(mobile);
          mobile.on('pageerror',e=>errors.push(e.message));
          await mobile.goto('http://127.0.0.1:4173/melodyme/',{waitUntil:'networkidle'});
          const dims=await mobile.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
          if(dims.scroll>dims.client+1)throw new Error('mobile overflow '+JSON.stringify(dims));
          await mobile.getByRole('button',{name:/开始探索/}).click();
          await mobile.locator('#story').fill('手机端验收：这首歌让我想起一次旅行。');
          await mobile.locator('#next').click();
          await mobile.locator('[data-mood="自由"]').click();
          await mobile.locator('#next').click();
          await mobile.locator('#next').click();
          await mobile.locator('#next').click();
          await mobile.locator('#results').waitFor({state:'visible'});
          const resultDims=await mobile.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
          if(resultDims.scroll>resultDims.client+1)throw new Error('mobile results overflow '+JSON.stringify(resultDims));
          if(errors.length)throw new Error('browser errors: '+errors.join('; '));
          console.log('PASS: map journey, empty validation, optional song fields, editable output, local save/reload, mobile overflow and no page errors.');
          await browser.close();
          JS
