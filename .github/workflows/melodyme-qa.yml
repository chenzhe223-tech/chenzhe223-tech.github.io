name: MelodyMe prototype QA

on:
  push:
    branches: [main]
    paths:
      - "melodyme/**"
      - "scripts/melodyme-live-qa.cjs"
      - ".github/workflows/melodyme-qa.yml"
  pull_request:
    paths:
      - "melodyme/**"
      - "scripts/melodyme-live-qa.cjs"
      - ".github/workflows/melodyme-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate HTML and embedded JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          html = Path("melodyme/index.html").read_text(encoding="utf-8")
          class Checker(HTMLParser):
              def error(self, message):
                  raise AssertionError(message)
          parser = Checker(convert_charrefs=True)
          parser.feed(html)
          parser.close()
          for token in ['<!doctype html>', 'name="viewport"', 'id="start"', 'id="next"', 'data-node="0"', 'localStorage', '真实 AI', 'action:"searchMusic"', 'id="musiccard"', 'id="rhythmStaff"', 'previewUrl', 'generateAlbumArt', 'aiCoverImage', 'inferSongFromStory', 'songAutoDetected', 'scoreMusicResult', 'q.country', 'Encounter']:
              assert token.lower() in html.lower(), f"missing required token: {token}"
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "no inline JavaScript found"
          Path("/tmp/melodyme-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          print(f"HTML source checks passed; {len(html)} chars")
          PY
          node --check /tmp/melodyme-inline.js
      - name: Validate nine poster modes and 27 prompt combinations
        run: |
          node <<'JS'
          const assert = require("node:assert/strict");
          global.window = {};
          require("./melodyme/poster-system.js");
          const engine = window.MelodyMePosterSystem;
          assert.equal(engine.modes.length, 9, "exactly nine poster modes");
          for (const mode of engine.modes) {
            for (const mood of ["calm", "nostalgic", "energetic"]) {
              const prompt = engine.buildPrompt({styleName:mode.styleName,mood,scene:"rainy window",palette:"warm sunset",substyle:mode.styleId === "color-sketch-comic" ? "gentle-journal" : ""});
              assert.ok(prompt.includes(mode.englishName), mode.styleId + " style lock missing");
              assert.ok(prompt.includes(mode.negativePrompt), mode.styleId + " negative prompt missing");
              assert.ok(prompt.includes("DO NOT render any text"), mode.styleId + " text exclusion missing");
              assert.ok(prompt.includes("OPTIONAL PALETTE NUANCE"), mode.styleId + " palette nuance missing");
            }
          }
          assert.equal(engine.byId("color-sketch-comic").substyles.length, 3);
          assert.equal(engine.inspectImage({naturalWidth:768,naturalHeight:1024}).technicalPassed, true);
          assert.equal(engine.inspectImage({naturalWidth:1,naturalHeight:1}).technicalPassed, false);
          console.log("PASS: 9 mode configs, 27 prompt combinations, 3 comic substyles, technical image checks.");
          JS
      - name: Syntax-check browser QA script
        run: node --check scripts/melodyme-live-qa.cjs
      - name: Create deterministic portrait PNG fixture
        run: |
          python - <<'PY'
          import struct, zlib
          from pathlib import Path
          width, height = 768, 1024
          raw = b"".join(b"\x00" + bytes([42, 68, 92]) * width for _ in range(height))
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">2I5B", width, height, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          Path("/tmp/melodyme-test-portrait.png").write_bytes(png)
          print(f"Created {width}x{height} deterministic PNG fixture ({len(png)} bytes)")
          PY
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile journey smoke tests
        run: |
          python -m http.server 4173 --directory . >/tmp/melodyme-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const errors = [];
          const { readFileSync } = await import('node:fs');
          const tinyPng = readFileSync('/tmp/melodyme-test-portrait.png');
          const catalog = { results: [
            { trackName:'QA Preview Track', artistName:'QA Artist', collectionName:'QA Album', artworkUrl100:'https://is1-ssl.mzstatic.com/image/thumb/qa/100x100bb.jpg', previewUrl:'https://audio-ssl.itunes.apple.com/qa-preview.m4a', releaseDate:'2001-01-01T00:00:00Z' },
            { trackName:'QA No Preview Track', artistName:'QA Artist', collectionName:'QA Album', artworkUrl100:'https://is1-ssl.mzstatic.com/image/thumb/qa2/100x100bb.jpg', releaseDate:'2002-01-01T00:00:00Z' }
          ] };
          async function mockExternalServices(page) {
            let pollinationsMode = 'ok';
            let workerImageMode = 'ok';
            await page.route(/https:\/\/itunes\.apple\.com\/search.*/, route => route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(catalog)}));
            await page.route(/https:\/\/image\.pollinations\.ai\/.*/, route => pollinationsMode === 'ok'
              ? route.fulfill({status:200,contentType:'image/png',body:tinyPng})
              : route.fulfill({status:503,contentType:'text/plain',body:'mock image failure'}));
            await page.route(/melodyme-ai\.chenzhe223\.workers\.dev/, async route => {
              const payload = route.request().postDataJSON() || {};
              if (payload.action === 'resolveCities') {
                const names = payload.input.cities;
                const coords = [{lng:108.9398,lat:34.3416},{lng:104.0668,lat:30.5728},{lng:121.4737,lat:31.2304},{lng:103.8198,lat:1.3521}];
                return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,action:'resolveCities',source:'AMap Web Service geocoding',cities:names.map((name,index)=>({index,name,matchedName:name,formattedAddress:name,province:'QA Province',city:name,adcode:String(index),...coords[index],source:'高德地图地理编码'}))})});
              }
              if (payload.action === 'searchMusic') {
                return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,action:'searchMusic',results:catalog.results,queries:8,failedQueries:0})});
              }
              if (payload.action === 'generateAlbumArt') {
                return workerImageMode === 'ok'
                  ? route.fulfill({status:200,contentType:'image/png',body:tinyPng})
                  : route.fulfill({status:502,contentType:'application/json',body:JSON.stringify({error:'ai_image_generation_failed'})});
              }
              const results = {
                generateMemoryStory:{title:'QA Story',story:'A story generated for QA.',core_line:'A song, a memory.',memory_summary:'QA memory',poster_title:'QA poster',poster_subtitle:'QA subtitle',song_connection:'QA song connection'},
                generateSocialCopy:{copy:'QA social copy.'},
                planPosterComposition:{recommended_style:'电影雾光',palette:['#d8c8c8','#20384f'],composition:'Simple centered composition',typography:'Editorial serif',image_treatment:'Soft grain',text_density:'low',visual_motifs:['light'],reason_summary:'Matches the memory mood'}
              };
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,action:payload.action,model:'mock-test',result:results[payload.action] || {}})});
            });
            return {setPollinationsMode:v=>{pollinationsMode=v;},setWorkerImageMode:v=>{workerImageMode=v;}};
          }
          const page = await browser.newPage({viewport:{width:1280,height:900}});
          const mock = await mockExternalServices(page);
          await page.addInitScript(()=>{if(!sessionStorage.getItem('melodyme-test-clean')){localStorage.clear();sessionStorage.setItem('melodyme-test-clean','1')}});
          page.on('pageerror', e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/melodyme/',{waitUntil:'networkidle'});
          if (!(await page.title()).includes('MelodyMe')) throw new Error('title missing');
          await page.getByRole('button',{name:/开始探索/}).click();
          const cities = ['西安','成都','上海','新加坡'];
          for (let i=0;i<4;i++) await page.locator('#cityInput'+i).fill(cities[i]);
          await page.locator('#citySongInput').fill('QA Preview Track');
          await page.locator('#citySearchSong').click();
          await page.locator('.city-track-option').first().waitFor({state:'visible'});
          if (!(await page.locator('#citySelectedTrack').innerText()).includes('QA Artist')) throw new Error('song search should automatically match the artist from the music catalog');
          if (await page.locator('#cityAudio').getAttribute('preload') !== 'none') throw new Error('music preview must not preload');
          if (await page.locator('#cityAudio').getAttribute('src') !== 'https://audio-ssl.itunes.apple.com/qa-preview.m4a') throw new Error('city map must use the exact catalog preview URL');
          await page.locator('#buildCityMap').click();
          await page.locator('#cityRouteSvg').waitFor({state:'visible'});
          if (await page.locator('#cityMapCanvas .city-map-pin').count() !== 4) throw new Error('map must show four geocoded city stops');
          if (!(await page.locator('#cityMapStatus').innerText()).includes('高德地图')) throw new Error('map must disclose AMap coordinate source');
          if (await page.locator('#cityPlayJourney').isDisabled()) throw new Error('selected preview track should enable journey playback');
          if (await page.locator('#downloadCityMap').isDisabled()) throw new Error('generated map should be downloadable');
          await page.locator('#downloadCityMap').click();
          if (await page.locator('#cityRouteSvg').count() !== 1) throw new Error('map download must not remove the map');
          const duplicateCities = ['西安','西安','上海','新加坡'];
          for (let i=0;i<4;i++) await page.locator('#cityInput'+i).fill(duplicateCities[i]);
          await page.locator('#buildCityMap').click();
          if (!(await page.getByText('请填写四座不同的城市').count())) throw new Error('duplicate cities must be rejected');
          if (!(await page.locator('#results').isHidden())) throw new Error('legacy poster flow should remain hidden in the new city map experience');
          const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          await mockExternalServices(mobile);
          mobile.on('pageerror',e=>errors.push(e.message));
          await mobile.goto('http://127.0.0.1:4173/melodyme/',{waitUntil:'networkidle'});
          const dims=await mobile.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
          if(dims.scroll>dims.client+1)throw new Error('mobile overflow '+JSON.stringify(dims));
          await mobile.getByRole('button',{name:/开始探索/}).click();
          for (const [i,name] of ['西安','成都','上海','新加坡'].entries()) await mobile.locator('#cityInput'+i).fill(name);
          await mobile.locator('#citySongInput').fill('QA Preview Track');
          await mobile.locator('#buildCityMap').click();
          await mobile.locator('#cityRouteSvg').waitFor({state:'visible'});
          if (await mobile.locator('#cityMapCanvas .city-map-pin').count() !== 4) throw new Error('mobile map must show four city pins');
          const resultDims=await mobile.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
          if(resultDims.scroll>resultDims.client+1)throw new Error('mobile city map overflow '+JSON.stringify(resultDims));
          if(errors.length)throw new Error('browser errors: '+errors.join('; '));
          console.log('PASS: four-city AMap geocoding flow, music catalog matching, preview URL, SVG route download, duplicate-city validation, mobile overflow and no page errors.');
          await browser.close();
          JS
