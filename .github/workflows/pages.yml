name: Deploy DAVYLAB to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "radar/data/**"
      - "radar/posters/**"
  schedule:
    # 07:30 Asia/Shanghai; GitHub may delay scheduled starts.
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  qa:
    name: Test AI daily brief before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh today's AI news and Skill shortlist
        run: python radar/scripts/build_daily.py
      - name: Diagnose AI enrichment configuration (without exposing secrets)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          cfg=json.loads(Path('radar/config/horizon.json').read_text(encoding='utf-8'))
          print('DeepSeek API key configured:', bool(os.environ.get('DEEPSEEK_API_KEY')))
          print('Configured DeepSeek model:', cfg.get('ai', {}).get('model', '(missing)'))
          PY
      - name: Run optional Horizon enrichment (bounded, non-blocking)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          # Horizon enriches the report, but must never block the validated RSS/GitHub baseline.
          if [ ! -f /tmp/Horizon/src/main.py ]; then
            if ! timeout 45s git clone --depth 1 https://github.com/Thysrael/Horizon.git /tmp/Horizon; then
              echo "::warning::Horizon clone unavailable or timed out; publishing will continue with source-backed baseline data."
              exit 0
            fi
          fi
          if [ -f /tmp/Horizon/requirements.txt ]; then
            if ! timeout 90s python -m pip install -r /tmp/Horizon/requirements.txt; then
              echo "::warning::Horizon dependency installation failed or timed out; publishing will continue with source-backed baseline data."
              exit 0
            fi
          fi
          if ! timeout 240s python radar/scripts/run_horizon.py; then
            echo "::warning::Horizon/AI enrichment failed or exceeded 240 seconds; publishing will continue only if subsequent date, source, poster, QR and browser QA checks pass."
          fi
      - name: Match story-specific images (free sources first)
        run: python radar/scripts/news_image_match.py
      - name: Validate today's date, fresh news and data contract
        run: |
          python -m py_compile radar/scripts/build_daily.py radar/scripts/run_horizon.py radar/scripts/news_image_match.py
          python -m unittest radar.scripts.test_daily_brief
          python -m unittest radar.scripts.test_news_image_match -v
          python - <<'PY'
          import datetime as dt, json
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p = Path('radar/data/latest.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          today = dt.datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          if d.get('report_date') != today or not d.get('generated_at', '').startswith(today):
              raise SystemExit(f"Stale date: report={d.get('report_date')} generated={d.get('generated_at')} expected={today}")
          news = d.get('news', [])
          if len(news) < 5 or int(d.get('sources_ok', 0)) < 1:
              raise SystemExit(f"Insufficient source data: news={len(news)} sources_ok={d.get('sources_ok')}")
          china = d.get('china_ai_news', [])
          if len(china) < 6:
              raise SystemExit(f"Insufficient China AI data: found {len(china)} source-backed stories, minimum required is 6; refusing to publish a short module")
          now = dt.datetime.now(dt.timezone.utc)
          china_cutoff = now - dt.timedelta(days=7)
          fresh_china = []
          seen_china_urls = set()
          for item in china:
              if not item.get('title') or not item.get('source') or not item.get('url', '').startswith('https://'):
                  continue
              url = item['url'].split('#', 1)[0].rstrip('/')
              if url in seen_china_urls:
                  continue
              try:
                  published = dt.datetime.fromisoformat(item.get('published', '').replace('Z', '+00:00'))
                  if published.tzinfo is None: published = published.replace(tzinfo=dt.timezone.utc)
                  if china_cutoff <= published <= now + dt.timedelta(hours=6):
                      fresh_china.append(item)
                      seen_china_urls.add(url)
              except Exception: pass
          if len(fresh_china) < 6:
              raise SystemExit(f"Insufficient fresh China AI stories: {len(fresh_china)}; need at least 6 published within seven days")
          fresh = []
          for item in news:
              try:
                  published = dt.datetime.fromisoformat(item.get('published', '').replace('Z', '+00:00'))
                  if published.tzinfo is None: published = published.replace(tzinfo=dt.timezone.utc)
                  if (now - published).total_seconds() <= 72 * 3600: fresh.append(item)
              except Exception: pass
          if len(fresh) < 3:
              raise SystemExit(f"Refusing stale report: only {len(fresh)} stories within 72 hours")
          if any(not x.get('url', '').startswith('https://') for x in news[:5]):
              raise SystemExit('One of the first five stories has no HTTPS source URL')
          archive = Path('radar/data/archive') / f'{today}.json'
          archive.parent.mkdir(parents=True, exist_ok=True)
          archive.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          history = sorted([x.name for x in Path('radar/data/archive').glob('*.json')], reverse=True)[:30]
          Path('radar/data/history.json').write_text(json.dumps({'days': history}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f"PASS: {today}; news={len(news)}; fresh_72h={len(fresh)}; China AI={len(fresh_china)} (minimum 6); sources={d.get('sources_ok')}/{d.get('sources_total')}")
          PY
      - name: Generate daily infographic poster
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pillow 'qrcode[pil]' opencv-python-headless
          python radar/scripts/generate_poster.py
          test -s radar/posters/latest.png
          test -s radar/posters/latest.json
          test -s "radar/posters/$(python -c "import json; print(json.load(open('radar/posters/latest.json'))['report_date'])").png"
          python - <<'PY'
          import cv2, json
          from pathlib import Path
          manifest=json.loads(Path('radar/posters/latest.json').read_text(encoding='utf-8'))
          poster=Path(manifest['poster'])
          if not poster.is_file(): raise SystemExit(f"Poster path missing: {poster}")
          image=cv2.imread(str(poster))
          if image is None: raise SystemExit(f"Poster PNG cannot be opened: {poster}")
          qr_crop = image[1600:1790, 25:220]
          decoded, points, _ = cv2.QRCodeDetector().detectAndDecode(qr_crop)
          if decoded != manifest['qr_url']: raise SystemExit('QR mismatch: decoded={!r}, expected={!r}'.format(decoded, manifest['qr_url']))
          print(f'PASS: poster image and QR verified: {decoded}')
          PY
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/radar-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/radar/daily/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/radar-http.log
          exit 1
      - name: Test daily briefing on desktop and mobile
        run: node scripts/qa-radar.cjs
      - name: Commit refreshed report and daily archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TODAY="$(TZ=Asia/Shanghai date +%F)"
          SNAPSHOT=/tmp/davy-radar-refresh
          mkdir -p "$SNAPSHOT"
          # Snapshot generated outputs before switching to the latest main, which
          # may already contain another run's files for the same date.
          cp radar/data/latest.json "$SNAPSHOT/latest.json"
          cp radar/data/image-cache.json "$SNAPSHOT/image-cache.json"
          cp "radar/data/archive/$TODAY.json" "$SNAPSHOT/today.json"
          cp "radar/posters/$TODAY.png" "$SNAPSHOT/today.png"
          cp "radar/posters/$TODAY.json" "$SNAPSHOT/today-poster.json"
          cp radar/posters/latest.png "$SNAPSHOT/latest.png"
          cp radar/posters/latest.json "$SNAPSHOT/latest-poster.json"

          git fetch origin main
          git reset --hard HEAD
          # Remove generated untracked files from this old checkout but retain QA artifacts.
          git clean -fd -e test-results/
          git checkout -B main origin/main
          cp "$SNAPSHOT/latest.json" radar/data/latest.json
          cp "$SNAPSHOT/image-cache.json" radar/data/image-cache.json
          cp "$SNAPSHOT/today.json" "radar/data/archive/$TODAY.json"
          cp "$SNAPSHOT/today.png" "radar/posters/$TODAY.png"
          cp "$SNAPSHOT/today-poster.json" "radar/posters/$TODAY.json"
          cp "$SNAPSHOT/latest.png" radar/posters/latest.png
          cp "$SNAPSHOT/latest-poster.json" radar/posters/latest.json

          # Rebuild the history index from the merged archive directory so
          # this run cannot delete history added by another run.
          python - <<'PY'
          import json
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import datetime as dt
          today = dt.datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          archives = Path('radar/data/archive')
          archives.mkdir(parents=True, exist_ok=True)
          if not (archives / f'{today}.json').is_file():
              raise SystemExit(f'Missing archive after sync: {today}.json')
          days = sorted((p.name for p in archives.glob('*.json')), reverse=True)[:30]
          Path('radar/data/history.json').write_text(json.dumps({'days': days}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add radar/data/latest.json radar/data/image-cache.json radar/data/history.json "radar/data/archive/$TODAY.json" "radar/posters/$TODAY.png" "radar/posters/$TODAY.json" radar/posters/latest.png radar/posters/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(radar): refresh daily AI brief'
            git push origin HEAD:main
          else
            echo 'No report data changes to commit.'
          fi
      - name: Upload daily briefing screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-brief-qa
          path: test-results/radar/
          if-no-files-found: warn
          retention-days: 14

  verify-live:
    name: Verify automatic GitHub Pages deployment
    runs-on: ubuntu-latest
    needs: qa
    timeout-minutes: 6
    steps:
      - name: Wait for the branch-triggered Pages build and verify live assets
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, json, time, urllib.request
          from zoneinfo import ZoneInfo

          base = 'https://chenzhe223-tech.github.io/radar/'
          today = dt.datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          last_error = 'not checked'
          headers = {'Cache-Control':'no-cache','User-Agent':'DavyRadar-Publish-Check/1.0'}
          for attempt in range(30):
              try:
                  stamp = str(time.time())
                  with urllib.request.urlopen(urllib.request.Request(base + 'daily/?verify=' + stamp, headers=headers), timeout=15) as response:
                      page = response.read().decode('utf-8', 'replace')
                      assert response.status == 200
                  assert 'id="chinaAI"' in page, 'China AI developments section missing from live page'
                  assert 'china-news-grid' in page, 'China AI card grid styling missing from live page'
                  with urllib.request.urlopen(urllib.request.Request(base + 'data/latest.json?verify=' + stamp, headers=headers), timeout=15) as response:
                      data = json.loads(response.read().decode('utf-8'))
                  assert data.get('report_date') == today, f"report_date={data.get('report_date')!r}, expected {today}"
                  assert data.get('generated_at', '').startswith(today), 'generated_at date mismatch'
                  assert len(data.get('news', [])) >= 5, 'fewer than five general news items'
                  assert sum(1 for x in data['news'] if x.get('url', '').startswith('https://')) >= 5, 'general news source links missing'
                  china_news = data.get('china_ai_news', [])
                  assert isinstance(china_news, list), 'China AI stories field missing'
                  for story in china_news:
                      assert story.get('url', '').startswith('https://'), 'China AI story source URL missing'
                      assert story.get('image_url', '').startswith('https://'), 'China AI story image missing'
                      assert story.get('category'), 'China AI story category missing'
                      assert story.get('published'), 'China AI story publication date missing'
                  poster_req = urllib.request.Request(base + 'posters/' + today + '.png?verify=' + stamp, headers=headers)
                  with urllib.request.urlopen(poster_req, timeout=15) as poster_response:
                      assert poster_response.status == 200 and poster_response.headers.get('Content-Type','').startswith('image/png'), 'poster PNG missing'
                  history_req = urllib.request.Request(base + 'data/history.json?verify=' + stamp, headers=headers)
                  with urllib.request.urlopen(history_req, timeout=15) as history_response:
                      history = json.loads(history_response.read().decode('utf-8'))
                  assert today + '.json' in history.get('days', []), 'today is missing from history index'
                  skill = (data.get('skills') or [{}])[0]
                  assert skill.get('url','').startswith('https://github.com/'), 'daily Skill recommendation missing a GitHub URL'
                  old_days = [x for x in history.get('days',[]) if x != today + '.json']
                  if old_days:
                      old_url = base + 'data/archive/' + old_days[0] + '?verify=' + stamp
                      with urllib.request.urlopen(urllib.request.Request(old_url,headers=headers),timeout=15) as old_response:
                          old_data = json.loads(old_response.read().decode('utf-8'))
                      assert old_data.get('report_date') == old_days[0][:10], 'archive date/content mismatch'
                  print(f"PASS: automatic Pages deployment verified; date={today}; global_news={len(data['news'])}; china_ai_news={len(china_news)}; generated_at={data['generated_at']}")
                  break
              except Exception as exc:
                  last_error = f'{type(exc).__name__}: {exc}'
                  print(f'Attempt {attempt + 1}/30: {last_error}')
                  time.sleep(10)
          else:
              raise SystemExit('Post-deploy verification failed: ' + last_error)
          PY
