name: Deploy DAVYLAB to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "radar/data/**"
  schedule:
    # 07:30 Asia/Shanghai; GitHub may delay scheduled starts.
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  qa:
    name: Test AI daily brief before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh today's AI news and Skill shortlist
        run: python radar/scripts/build_daily.py
      - name: Run optional Horizon enrichment
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          if [ ! -d /tmp/Horizon ]; then
            git clone --depth 1 https://github.com/Thysrael/Horizon.git /tmp/Horizon
          fi
          if [ -f /tmp/Horizon/requirements.txt ]; then
            python -m pip install -r /tmp/Horizon/requirements.txt
          fi
          python radar/scripts/run_horizon.py
      - name: Validate today's date, fresh news and data contract
        run: |
          python -m py_compile radar/scripts/build_daily.py radar/scripts/run_horizon.py
          python -m unittest radar.scripts.test_daily_brief
          python - <<'PY'
          import datetime as dt, json
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p = Path('radar/data/latest.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          today = dt.datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          if d.get('report_date') != today or not d.get('generated_at', '').startswith(today):
              raise SystemExit(f"Stale date: report={d.get('report_date')} generated={d.get('generated_at')} expected={today}")
          news = d.get('news', [])
          if len(news) < 5 or int(d.get('sources_ok', 0)) < 1:
              raise SystemExit(f"Insufficient source data: news={len(news)} sources_ok={d.get('sources_ok')}")
          now = dt.datetime.now(dt.timezone.utc)
          fresh = []
          for item in news:
              try:
                  published = dt.datetime.fromisoformat(item.get('published', '').replace('Z', '+00:00'))
                  if published.tzinfo is None: published = published.replace(tzinfo=dt.timezone.utc)
                  if (now - published).total_seconds() <= 72 * 3600: fresh.append(item)
              except Exception: pass
          if len(fresh) < 3:
              raise SystemExit(f"Refusing stale report: only {len(fresh)} stories within 72 hours")
          if any(not x.get('url', '').startswith('https://') for x in news[:5]):
              raise SystemExit('One of the first five stories has no HTTPS source URL')
          archive = Path('radar/data/archive') / f'{today}.json'
          archive.parent.mkdir(parents=True, exist_ok=True)
          archive.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          history = sorted([x.name for x in Path('radar/data/archive').glob('*.json')], reverse=True)[:30]
          Path('radar/data/history.json').write_text(json.dumps({'days': history}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f"PASS: {today}; news={len(news)}; fresh_72h={len(fresh)}; sources={d.get('sources_ok')}/{d.get('sources_total')}")
          PY
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/radar-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/radar/daily/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/radar-http.log
          exit 1
      - name: Test daily briefing on desktop and mobile
        run: node scripts/qa-radar.cjs
      - name: Commit refreshed report and daily archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar/data/latest.json radar/data/history.json radar/data/archive/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(radar): refresh daily AI brief'
            git push origin HEAD:main
          else
            echo 'No report data changes to commit.'
          fi
      - name: Upload daily briefing screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-brief-qa
          path: test-results/radar/
          if-no-files-found: warn
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs: qa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
      - name: Verify live daily brief after deployment
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, json, time, urllib.request
          from zoneinfo import ZoneInfo
          base = 'https://chenzhe223-tech.github.io/radar/'
          today = dt.datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          last_error = 'not checked'
          for attempt in range(24):
              try:
                  stamp = str(time.time())
                  headers = {'Cache-Control':'no-cache','User-Agent':'DavyRadar-Publish-Check/1.0'}
                  with urllib.request.urlopen(urllib.request.Request(base + 'daily/?verify=' + stamp, headers=headers), timeout=15) as response:
                      page = response.read().decode('utf-8', 'replace')
                      assert response.status == 200
                  with urllib.request.urlopen(urllib.request.Request(base + 'data/latest.json?verify=' + stamp, headers=headers), timeout=15) as response:
                      data = json.loads(response.read().decode('utf-8'))
                  assert data.get('report_date') == today, f"report_date={data.get('report_date')!r}, expected {today}"
                  assert data.get('generated_at', '').startswith(today), 'generated_at date mismatch'
                  assert len(data.get('news', [])) >= 5, 'fewer than five news items'
                  assert sum(1 for x in data['news'] if x.get('url', '').startswith('https://')) >= 5, 'source links missing'
                  assert 'latest.json' in page, 'daily page data loader missing'
                  print(f"PASS: live page and JSON verified; date={today}; news={len(data['news'])}; generated_at={data['generated_at']}")
                  break
              except Exception as exc:
                  last_error = f'{type(exc).__name__}: {exc}'
                  print(f'Attempt {attempt + 1}/24: {last_error}')
                  time.sleep(10)
          else:
              raise SystemExit('Post-deploy verification failed: ' + last_error)
          PY
