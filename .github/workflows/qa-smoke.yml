name: DAVYLAB Browser QA

on:
  workflow_run:
    workflows: ["Deploy DAVYLAB to GitHub Pages", "pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: davylab-browser-qa-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Confirm Pages deployment is complete for this commit
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node -e "const https=require('https'); const fs=require('fs'); const u='https://api.github.com/repos/chenzhe223-tech/chenzhe223-tech.github.io/pages/deployments/'+process.env.TARGET_SHA; https.get(u,{headers:{'User-Agent':'davylab-browser-qa',Accept:'application/vnd.github+json'}},r=>{let b='';r.on('data',x=>b+=x);r.on('end',()=>{ if(r.statusCode===404){console.log('Pages deployment endpoint unavailable; continuing with live asset and runtime checks');process.exit(0)} if(r.statusCode<200||r.statusCode>=300){console.error('Pages deployment lookup failed: '+r.statusCode);process.exit(1)} console.log(b); });}).on('error',e=>{console.error(e.message);process.exit(1)})"
      - name: Check out DAVYLAB source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test the live website and app links
        run: node scripts/qa-smoke.cjs
      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davylab-browser-qa
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
