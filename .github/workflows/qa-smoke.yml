name: DAVYLAB Browser QA

on:
  push:
    branches: [main]
    paths:
      - "keypocket/**"
      - "scripts/qa-smoke.cjs"
      - ".github/workflows/qa-smoke.yml"
  workflow_run:
    workflows: ["Deploy DAVYLAB to GitHub Pages", "pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  browser-smoke:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: davylab-browser-qa-${{ github.event_name == 'push' && github.sha || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Wait for Pages deployment of this commit
        if: github.event_name == 'push'
        env:
          TARGET_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const https = require('https');
          const target = process.env.TARGET_SHA;
          const token = process.env.GH_TOKEN;
          const started = Date.now();
          const timeoutMs = 8 * 60 * 1000;
          const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
          function getRuns() {
            const path = '/repos/chenzhe223-tech/chenzhe223-tech.github.io/actions/runs?head_sha=' + encodeURIComponent(target) + '&per_page=100';
            return new Promise((resolve, reject) => {
              const req = https.get('https://api.github.com' + path, {
                headers: {
                  'User-Agent': 'DAVYLAB-KeyPocket-Browser-QA',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Authorization': 'Bearer ' + token
                }
              }, res => {
                let body = '';
                res.setEncoding('utf8');
                res.on('data', chunk => body += chunk);
                res.on('end', () => {
                  if (res.statusCode !== 200) return reject(new Error('GitHub Actions lookup HTTP ' + res.statusCode));
                  try { resolve(JSON.parse(body)); } catch (error) { reject(error); }
                });
              });
              req.setTimeout(15000, () => req.destroy(new Error('GitHub Actions lookup timed out')));
              req.on('error', reject);
            });
          }
          async function main() {
            while (Date.now() - started < timeoutMs) {
              const data = await getRuns();
              const pages = (data.workflow_runs || [])
                .filter(run => run.name === 'pages build and deployment' && run.head_sha === target)
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
              if (pages && pages.status === 'completed') {
                if (pages.conclusion !== 'success') throw new Error('Pages deployment for ' + target + ' ended as ' + pages.conclusion);
                console.log('PASS: matching Pages deployment completed successfully for ' + target + ' (run ' + pages.id + ')');
                return;
              }
              console.log('Waiting for Pages deployment for ' + target + '; status=' + (pages ? pages.status : 'not yet created'));
              await pause(10000);
            }
            throw new Error('Timed out waiting for Pages deployment for ' + target);
          }
          main().catch(error => { console.error(error.message); process.exit(1); });
          NODE
      - name: Check out DAVYLAB source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.workflow_run.head_sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install chromium
      - name: Test the live website and app links
        run: node scripts/qa-smoke.cjs
      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davylab-browser-qa
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
