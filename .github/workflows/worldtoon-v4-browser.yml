name: WorldToon V4 real browser production journey QA
on:
  pull_request:
    paths:
      - 'comic-studio/**'
      - '.github/workflows/worldtoon-v4-browser.yml'
  push:
    branches: [main]
    paths:
      - 'comic-studio/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-audit playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test all three creation routes and real browser draft persistence
        run: node comic-studio/tests/worldtoon-v4-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldtoon-v4-browser-acceptance
          path: |
            worldtoon-v4-screenshots/
            worldtoon-v4-browser-qa.json
          if-no-files-found: ignore
