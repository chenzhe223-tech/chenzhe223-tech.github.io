name: DAVYLAB Operations isolated checks
on:
  push:
    paths:
      - 'topic-studio/operations/**'
      - '.github/workflows/topic-studio-operations.yml'
  pull_request:
    paths:
      - 'topic-studio/operations/**'
      - '.github/workflows/topic-studio-operations.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check topic-studio/operations/core.js
          node --check topic-studio/operations/ui.js
          node --check topic-studio/operations/bridge.js
      - name: Guarded core regression
        run: |
          node topic-studio/operations/tests/core.test.cjs
          node topic-studio/operations/tests/bridge.test.cjs
