name: KeyPocket Skill Handoff QA

on:
  push:
    branches: ["main"]
    paths:
      - "keypocket/**"
      - "radar/daily/index.html"
      - "scripts/qa-keypocket-skill-handoff.cjs"
      - "scripts/e2e-keypocket-skill-handoff.cjs"
      - ".github/workflows/keypocket-skill-handoff.yml"
  pull_request:
    paths:
      - "keypocket/**"
      - "radar/daily/index.html"
      - "scripts/qa-keypocket-skill-handoff.cjs"
      - "scripts/e2e-keypocket-skill-handoff.cjs"
      - ".github/workflows/keypocket-skill-handoff.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-handoff:
    name: Verify source contract and live assets
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check KeyPocket JavaScript syntax
        run: node --check keypocket/app.js

      - name: Validate Skill Radar collector and historical ranking
        run: |
          node --check scripts/build-keypocket-skill-radar.cjs
          node scripts/build-keypocket-skill-radar.cjs --self-test

      - name: Check Radar-to-KeyPocket integration contract
        run: node scripts/qa-keypocket-skill-handoff.cjs

      - name: Verify published assets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          page_url='https://chenzhe223-tech.github.io/keypocket/?handoff-check=kp-v2-sync-client-20261102-12'
          app_url='https://chenzhe223-tech.github.io/keypocket/app.js?v=kp-v2-sync-client-20261102-12'
          radar_url='https://chenzhe223-tech.github.io/radar/daily/'
          for attempt in $(seq 1 36); do
            page="$(curl --fail --silent --show-error --max-time 20 "$page_url&attempt=$attempt" 2>/dev/null || true)"
            app="$(curl --fail --silent --show-error --max-time 20 "$app_url" 2>/dev/null || true)"
            radar="$(curl --fail --silent --show-error --max-time 20 "$radar_url?handoff-check=$attempt" 2>/dev/null || true)"
            if [[ -n "$page" ]] && grep -q 'app.js?v=kp-v2-sync-client-20261102-12' <<<"$page" \
              && [[ -n "$app" ]] && grep -q "window.__kpBuildVersion='kp-v2-sync-client-20261102-12'" <<<"$app" \
              && grep -q 'window.__kpProjectRendererReady = true' <<<"$app" \
              && grep -q 'data-kp-skill-save' <<<"$radar"; then
              echo "PASS: live KeyPocket HTML references the expected V2 bundle; bundle and Radar handoff markup are published."
              exit 0
            fi
            echo "Waiting for matching KeyPocket HTML, JS bundle and Radar handoff (attempt $attempt/36)..."
            sleep 10
          done
          echo "::error::Matching KeyPocket HTML/JS and Radar handoff assets did not appear after retry window."
          exit 1

      - name: Install Playwright
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
        run: npm install --no-save --no-audit --no-fund playwright

      - name: Install Chromium
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
        run: npx playwright install --with-deps chromium

      - name: Exercise the live one-click Skill collection flow
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
        run: node scripts/e2e-keypocket-skill-handoff.cjs
