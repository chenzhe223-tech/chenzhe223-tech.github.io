name: KeyPocket Skill Handoff QA

on:
  push:
    branches: ["main"]
    paths:
      - "keypocket/**"
      - "radar/daily/index.html"
      - "scripts/qa-keypocket-skill-handoff.cjs"
      - ".github/workflows/keypocket-skill-handoff.yml"
  pull_request:
    paths:
      - "keypocket/**"
      - "radar/daily/index.html"
      - "scripts/qa-keypocket-skill-handoff.cjs"
      - ".github/workflows/keypocket-skill-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-handoff:
    name: Verify source contract and live assets
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check KeyPocket JavaScript syntax
        run: node --check keypocket/app.js

      - name: Check Radar-to-KeyPocket integration contract
        run: node scripts/qa-keypocket-skill-handoff.cjs

      - name: Verify published assets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          app_url='https://chenzhe223-tech.github.io/keypocket/app.js?v=kp-radar-skill-bridge-1'
          radar_url='https://chenzhe223-tech.github.io/radar/daily/'
          for attempt in $(seq 1 24); do
            app="$(curl --fail --silent --show-error --max-time 20 "$app_url" 2>/dev/null || true)"
            radar="$(curl --fail --silent --show-error --max-time 20 "$radar_url?handoff-check=$attempt" 2>/dev/null || true)"
            if [[ -n "$app" ]] && grep -q 'kp.radar.pending-skills.v1' <<<"$app" && grep -q 'data-kp-skill-save' <<<"$radar"; then
              echo "PASS: live KeyPocket bundle and Radar handoff markup are published."
              exit 0
            fi
            echo "Waiting for GitHub Pages assets (attempt $attempt/24)..."
            sleep 10
          done
          echo "::error::Live KeyPocket/Radar handoff assets did not appear after retry window."
          exit 1
