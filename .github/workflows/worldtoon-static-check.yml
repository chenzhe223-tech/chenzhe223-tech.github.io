name: WORLD/TOON static quality gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'comic-studio/**'
      - '.github/workflows/worldtoon-static-check.yml'
  push:
    branches: [main]
    paths:
      - 'comic-studio/**'
      - '.github/workflows/worldtoon-static-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check editorial scoring and production module syntax
        run: |
          node --check comic-studio/ranking.js
          node --check comic-studio/comic-engine.js
          node --check comic-studio/comic-visuals.js
          node --check comic-studio/creative-director.js
          node --check comic-studio/creative-pilot.js
      - name: Check browser scripts
        run: |
          node --check comic-studio/app.js
          node --check comic-studio/archive.js
          node --check comic-studio/extension.js
          node --check comic-studio/briefing.js
          node --check comic-studio/personalize.js
      - name: Verify four-Skill live integration
        run: node comic-studio/tests/comic-engine.cjs
      - name: Verify evergreen sources and CC0 public-domain gate
        run: node comic-studio/tests/heritage.cjs
      - name: Verify D1 materialized discovery and instant category switching
        run: node comic-studio/tests/discovery-cache.cjs
      - name: Verify creative director human signoff and GitHub contract
        run: node comic-studio/tests/creative-director.cjs
      - name: Verify visual pilot signed author approval
        run: node comic-studio/tests/creative-pilot.cjs
      - name: Exercise one-click research-first task generation
        run: node comic-studio/tests/task-flow.cjs
      - name: Test six-dimension editorial scoring and filtering
        run: node comic-studio/tests/rankings.cjs
      - name: Check Worker module syntax
        run: node --check --input-type=module < comic-studio/worker.js
      - name: Check dual-track invariants
        shell: python
        run: |
          from pathlib import Path
          root=Path('comic-studio')
          source=(root/'worker.js').read_text('utf8')
          archive=(root/'archive.js').read_text('utf8')
          app=(root/'app.js').read_text('utf8')
          html=(root/'index.html').read_text('utf8')
          assert "chenzhe223-tech/worldtoon" in source and "chenzhe223-tech/worldtoon" in archive
          assert "public_readonly" in source
          assert "meta.private!==true" in source
          assert "wtArchivePublicIndex" in source
          assert "ready_for_workbuddy" in archive
          assert "mark-published':notify(" in app, "Never allow local publication to replace repo receipts"
          assert 'archive.js' in html and 'data-route="handoff"' in html
          assert 'ranking.js' in html and 'wtEditorialRank.select' in (root/'extension.js').read_text('utf8')
          assert 'wtEditorialRank.select' in (root/'briefing.js').read_text('utf8')
          assert "research_required" in source and "t.research_required!==true" in source
          assert "wfPrepareTask(p);" in app
          assert '研究阶段' in app and 'verified_sources' in app
          assert "research_required:o.research_required===true" in archive
          assert "wfInlineEditor(p)" in app
          assert 'davylab-worldtoon-comics' not in (source+archive+app)
          print('WORLD/TOON key production invariants passed')
