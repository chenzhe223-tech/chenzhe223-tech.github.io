name: AI Daily Brief QA

on:
  pull_request:
    branches: [main]
    paths:
      - "radar/daily/**"
      - "radar/data/**"
      - "radar/scripts/**"
      - "scripts/qa-radar.cjs"
      - ".github/workflows/qa-radar.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh source-backed report for contract tests
        run: python radar/scripts/build_daily.py
      - name: Validate daily brief data contract
        run: |
          python -m py_compile radar/scripts/build_daily.py radar/scripts/run_horizon.py
          python -m unittest radar.scripts.test_daily_brief
          python -m unittest radar.scripts.test_news_image_match -v
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/radar-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/radar/daily/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/radar-http.log
          exit 1
      - name: Test daily briefing on desktop and mobile
        run: node scripts/qa-radar.cjs
      - name: Upload daily briefing screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-brief-qa
          path: test-results/radar/
          if-no-files-found: warn
          retention-days: 14
