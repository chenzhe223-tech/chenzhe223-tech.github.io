name: AI Daily Brief QA

on:
  pull_request:
    branches: [main]
    paths:
      - "radar/daily/**"
      - "radar/data/**"
      - "radar/scripts/**"
      - "scripts/qa-radar.cjs"
      - ".github/workflows/qa-radar.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate committed report fixture for browser tests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('radar/data/latest.json').read_text(encoding='utf-8'))
          assert len(report.get('news') or []) >= 5, 'committed report has fewer than five source news items'
          assert len(report.get('top5') or []) == 5, 'committed report must have exactly five editorial stories'
          assert len(report.get('china_ai_news') or []) >= 6, 'committed report has fewer than six China AI stories'
          assert len(report.get('skills') or []) >= 5, 'committed report has fewer than five Skills'
          assert all(str(x.get('image_url') or '').startswith('https://') for x in report['top5']), 'a top-five story is missing an HTTPS image'
          assert all(str(x.get('image_url') or '').startswith('https://') for x in report['china_ai_news']), 'a China AI story is missing an HTTPS image'
          assert all(x.get('quality_status') == 'PASS' for x in report['skills']), 'committed report includes an unverified Skill'
          print('PASS: committed browser fixture meets story, image and Skill contracts; date=' + str(report.get('report_date')))
          PY
      - name: Validate daily brief data contract
        run: |
          python -m py_compile radar/scripts/build_daily.py radar/scripts/run_horizon.py radar/scripts/news_image_match.py radar/scripts/reverse_image_search.py
          python -m unittest radar.scripts.test_daily_brief
          python -m unittest radar.scripts.test_news_image_match -v
      - name: Cache Playwright browser and npm downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-radar-playwright-v1
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install chromium
          node -e "require('playwright').chromium.launch({headless:true}).then(async b=>{await b.close();console.log('PASS: Chromium launch smoke test')}).catch(e=>{console.error(e);process.exit(1)})"
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/radar-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/radar/daily/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/radar-http.log
          exit 1
      - name: Test daily briefing on desktop and mobile
        run: node scripts/qa-radar.cjs
      - name: Upload daily briefing screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-brief-qa
          path: test-results/radar/
          if-no-files-found: warn
          retention-days: 14
