name: DAVYLAB News Engine isolated CI
on:
  pull_request:
    paths:
      - 'news-engine/**'
      - '.github/workflows/news-engine-p0.yml'
  workflow_dispatch:

# Strictly separate from radar/daily/ production publish and poster gates.
permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Contract tests (offline and without credentials)
        run: python -m unittest discover -s news-engine -p 'test_*.py' -v
      - name: Validate editor JavaScript syntax (no browser dependencies)
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('news-engine/editor.html').read_text(encoding='utf-8')
          script=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/news-engine-editor.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/news-engine-editor.js

  live-feed-sample:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect real RSS sources into isolated ephemeral output
        run: |
          mkdir -p news-engine/data
          python news-engine/collector.py --out news-engine/data/latest-shadow.json --history news-engine/data/temporary-history.json
      - name: Verify all five source responses, never mark leads as verified
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("news-engine/data/latest-shadow.json").read_text())
          diagnostics=x["diagnostics"]
          print(json.dumps(diagnostics,ensure_ascii=False,indent=2))
          assert len(diagnostics)==5, "expected five feed checks"
          assert all(d["status"]=="ok" for d in diagnostics), "one or more feeds failed"
          assert all(s.get("verification_status")=="source_not_independently_verified" for s in x["stories"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-engine-live-feed-sample
          path: news-engine/data/latest-shadow.json
          if-no-files-found: ignore
          retention-days: 7

  durable-history-shadow:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: news-engine-isolated-history-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Contract tests before isolated state write
        run: python -m unittest discover -s news-engine -p 'test_*.py' -v
      - name: Verify five real sources and persist 90-day keys on news-engine-state only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python news-engine/history_backend.py --out news-engine/data/latest-shadow.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-engine-durable-shadow
          path: news-engine/data/latest-shadow.json
          if-no-files-found: ignore
          retention-days: 7

  browser-editor-e2e:
    if: github.event_name == 'pull_request'
    # Playwright 1.55 supports Ubuntu 24.04, not the current ubuntu-latest 26.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install open-source headless browser test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Validate and contract-test isolated online Worker (offline)
        run: |
          python3 news-engine/build_preview_worker.py --out /tmp/davylab-news-preview.js
          node --check /tmp/davylab-news-preview.js
          node news-engine/test_preview_worker.cjs
      - name: Test actual desktop and mobile review workflow in Chromium (offline)
        env:
          NEWS_ENGINE_SCREENSHOT_DIR: test-results/news-engine/browser
        run: node news-engine/test_editor_browser.cjs
      - name: Upload evidence screenshots and review-only exports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-engine-editor-browser-qa
          path: test-results/news-engine/browser/
          if-no-files-found: ignore
          retention-days: 7

  production-isolation-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject any Radar production, poster or workflow changes in News Engine PR
        run: |
          git fetch origin main
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD"],
              text=True
          ).splitlines()
          allowed_workflows = {
              ".github/workflows/news-engine-p0.yml",
              ".github/workflows/news-engine-public-api.yml",
              ".github/workflows/news-engine-p1-consumers.yml",
              ".github/workflows/news-engine-p2.yml",
              ".github/workflows/news-engine-p3.yml",
          }
          # P1 is limited to the existing read-only WorldToon/WeChat discovery
          # entrypoints. Never allow edits to Radar publication, poster or auth.
          allowed_consumer_files = {
              "comic-studio/briefing.js",
              "comic-studio/worker.js",
              "comic-studio/index.html",
              "comic-studio/news-history-p3.js",
              "comic-studio/news-history-p3.css",
              "topic-studio/news-history-p3.js",
              "topic-studio/xnews-discovery.js",
              "topic-studio/index.html",
          }
          forbidden = [p for p in changed if not (
              p.startswith("news-engine/") or p in allowed_workflows or p in allowed_consumer_files
          )]
          if ".github/workflows/news-engine-public-api.yml" in changed:
              from pathlib import Path
              workflow = Path(".github/workflows/news-engine-public-api.yml").read_text()
              assert "pull_request:" in workflow and "contents: read" in workflow
              assert not any(
                  term in workflow for term in (
                      "\n  push:", "\n  schedule:", "\n  workflow_run:",
                      "contents: write", "id-token: write"
                  )
              ), "Public API QA workflow must be PR-scoped, read-only, without deployment"
          if ".github/workflows/news-engine-p1-consumers.yml" in changed:
              from pathlib import Path
              workflow = Path(".github/workflows/news-engine-p1-consumers.yml").read_text()
              assert "contents: read" in workflow
              assert "branches: [main]" in workflow
              assert not any(term in workflow for term in (
                  "\n  schedule:", "contents: write", "id-token: write",
                  "wrangler deploy", "cloudflare.request", "git push"
              )), "P1 QA workflow must be read-only and deploy-isolated"
          if ".github/workflows/news-engine-p3.yml" in changed:
              from pathlib import Path
              wf=Path(".github/workflows/news-engine-p3.yml").read_text()
              assert "contents: read" in wf and "branches: [main]" in wf
              assert "node news-engine/test_p3_browser.cjs" in wf
              assert "node news-engine/test_p3_online.cjs" in wf
              assert not any(term in wf for term in (
                  "\n  schedule:", "contents: write", "id-token: write",
                  "wrangler deploy", "cloudflare.request", "git push",
                  "secrets.GITHUB_TOKEN"
              )), "P3 integration CI must be read-only"
          p3=Path("news-engine/p3-widget.js")
          if any(p in changed for p in ("comic-studio/news-history-p3.js","topic-studio/news-history-p3.js")):
              assert p3.exists(), "Canonical P3 widget missing"
              for peer in ("comic-studio/news-history-p3.js","topic-studio/news-history-p3.js"):
                  assert Path(peer).read_bytes()==p3.read_bytes(), "P3 shared widget drift"
          if "comic-studio/worker.js" in changed:
              # Strict Worker exception: one-line CSP origin addition (P1) OR
              # exactly two explicit P3 first-party static filenames. The
              # whole old page CSP, origin, bindings and route code stay intact.
              patch = subprocess.check_output(
                  ["git","diff","--unified=0","origin/main...HEAD","--","comic-studio/worker.js"],
                  text=True
              )
              gone = [x[1:] for x in patch.splitlines() if x.startswith("-") and not x.startswith("---")]
              added = [x[1:] for x in patch.splitlines() if x.startswith("+") and not x.startswith("+++")]
              assert len(gone)==len(added)==1, "WorldToon Worker change must be exactly one line"
              old_csp = "connect-src 'self' https://qjyqaydfezbpeimpvlcb.supabase.co;"
              new_csp = "connect-src 'self' https://qjyqaydfezbpeimpvlcb.supabase.co https://davylab-news-api.chenzhe223.workers.dev;"
              old_static = "briefing\\.js|archive\\.js"
              new_static = "briefing\\.js|news-history-p3\\.js|news-history-p3\\.css|archive\\.js"
              allowed = (old_csp in gone[0] and gone[0].replace(old_csp,new_csp)==added[0]) or (
                  old_static in gone[0] and gone[0].replace(old_static,new_static)==added[0])
              assert allowed, "Only approved source allowlist or CSP changes permitted"
          if ".github/workflows/news-engine-p2.yml" in changed:
              from pathlib import Path
              workflow = Path(".github/workflows/news-engine-p2.yml").read_text()
              assert "contents: read" in workflow and "branches: [main]" in workflow
              assert "news-engine/test_p2_history.cjs" in workflow
              assert "news-engine/test_p2_online.cjs" in workflow
              assert not any(term in workflow for term in (
                  "\n  schedule:", "contents: write", "id-token: write",
                  "wrangler deploy", "cloudflare.request", "git push",
                  "secrets.GITHUB_TOKEN"
              )), "P2 QA workflow must be read-only and cannot deploy or modify Radar"
          print("News Engine changed paths:", changed)
          assert not forbidden, "P0 production isolation violated: " + repr(forbidden)
          assert changed, "PR has no new Engine changes to validate"
          PY

  staging-online-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed independent Worker over HTTPS (read-only)
        run: node news-engine/test_preview_online.cjs
