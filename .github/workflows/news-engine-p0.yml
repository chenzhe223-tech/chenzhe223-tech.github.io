name: DAVYLAB News Engine P0
on:
  pull_request:
    paths:
      - 'news-engine/**'
      - '.github/workflows/news-engine-p0.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate news collector contracts
        run: python -m unittest discover -s news-engine -p 'test_*.py' -v
