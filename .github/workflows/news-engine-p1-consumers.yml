name: News Engine P1 Consumer Integration CI
on:
  push:
    branches: [main]
    paths:
      - 'comic-studio/briefing.js'
      - 'comic-studio/worker.js'
      - 'news-engine/test_p1_worldtoon_csp.cjs'
      - 'comic-studio/index.html'
      - 'topic-studio/xnews-discovery.js'
      - 'topic-studio/index.html'
      - 'news-engine/p1-knowa-topic-adapter.js'
      - 'news-engine/test_p1_online.cjs'
  pull_request:
    paths:
      - 'comic-studio/briefing.js'
      - 'comic-studio/worker.js'
      - 'news-engine/test_p1_worldtoon_csp.cjs'
      - 'comic-studio/index.html'
      - 'topic-studio/xnews-discovery.js'
      - 'topic-studio/index.html'
      - 'news-engine/p1-knowa-topic-adapter.js'
      - 'news-engine/test_p1_consumers.cjs'
      - 'news-engine/test_p1_browser.cjs'
      - '.github/workflows/news-engine-p1-consumers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax and source provenance / fallback tests
        run: |
          node --check comic-studio/briefing.js
          node --check topic-studio/xnews-discovery.js
          node --check news-engine/p1-knowa-topic-adapter.js
          node --check news-engine/test_p1_consumers.cjs
          node news-engine/test_p1_consumers.cjs
          node news-engine/test_p1_worldtoon_csp.cjs
      - name: Validate read-only news API real HTTPS response
        run: |
          node --input-type=module - <<'JS'
          const u="https://davylab-news-api.chenzhe223.workers.dev/api/v1/news?stream=overseas&limit=6";
          const r=await fetch(u,{signal:AbortSignal.timeout(20000)});
          if(!r.ok)throw Error('News API unreachable '+r.status);
          const d=await r.json();
          if(!Array.isArray(d.data)||d.data.length<3||d.publishable!==false)throw Error('News API unsupported');
          if(!d.data.every(x=>x.publishable===false&&x.source_url?.startsWith('https://')))throw Error('unsafe news record');
          console.log(JSON.stringify({PASS:true,issue:d.issue_date,records:d.data.length,readOnly:true}));
          JS

  consumer-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium, CJK and test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: P1 browser UI and recovery
        run: |
          python3 -m http.server 8877 --bind 127.0.0.1 >/tmp/news-p1.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8877/topic-studio/ >/dev/null && break; sleep 1; done
          node news-engine/test_p1_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: davylab-news-engine-p1-consumer-browser
          path: test-results/news-engine-p1/
          if-no-files-found: ignore
          retention-days: 7

  knowa-production-readonly-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real KNOWA Worker live topic API and unchanged knowledge health
        run: |
          node --input-type=module - <<'JS'
          const base="https://davylab-knowa-p0.chenzhe223.workers.dev";
          const health=await fetch(base+"/api/health",{signal:AbortSignal.timeout(16000)});
          if(!health.ok)throw Error("KNOWA health HTTP "+health.status);
          const h=await health.json();
          if(h.ok!==true||!h.knowledgeAssets)throw Error("KNOWA original knowledge backend altered");
          const r=await fetch(base+"/api/topics?refresh="+Date.now(),{signal:AbortSignal.timeout(60000)});
          if(!r.ok)throw Error("KNOWA topics HTTP "+r.status);
          const d=await r.json();
          if(!d.ok||!Array.isArray(d.items)||!d.items.length)throw Error("KNOWA existing topics broken");
          const news=d.items.filter(x=>x.sourceName?.startsWith("DAVYLAB News Engine"));
          console.log("KNOWA P1 safe diagnostics",JSON.stringify({newsEngine:d.newsEngine,sources:(d.sources||[]).map(x=>({name:x.name,status:x.status,count:x.count})),originalItems:d.items.length}));
          if(!news.length)throw Error("P1 News Engine topic candidates not visible in existing KNOWA pool");
          if(news.some(x=>x.publishable!==false||x.verificationStatus!=="source_not_independently_verified"||
              !x.sourceUrl?.startsWith("https://")))throw Error("P1 evidence/rights guard violation");
          if(!d.sources?.some(x=>x.name==="DAVYLAB News Engine"&&x.status==="ok"))throw Error("P1 origin health missing");
          console.log(JSON.stringify({result:"PASS",knowledgeAssets:h.knowledgeAssets,existingItems:d.items.length,
            newsEngineAdded:news.length,newsEngineStatus:d.newsEngine?.status,
            keysPreserved:["AI_QUOTA","TOPIC_STORE","DEEPSEEK_API_KEY"].length,autoPublish:false}));
          JS

  deployed-production-qa:
    if: github.event_name == 'push'
    needs: [consumer-contract,knowa-production-readonly-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify live production WordToon + WeChat platform after Pages propagation
        run: |
          node --check news-engine/test_p1_online.cjs
          node news-engine/test_p1_online.cjs
