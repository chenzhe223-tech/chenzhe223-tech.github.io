name: WORLD/TOON private-index cache regression

on:
  push:
    branches: [main]
    paths:
      - 'comic-studio/archive.js'
      - 'comic-studio/sw.js'
      - 'comic-studio/styles.css'
      - 'comic-studio/index.html'
      - 'comic-studio/app.js'
      - 'comic-studio/tests/production-desk.cjs'
      - 'comic-studio/tests/character-deepseek.cjs'
      - 'comic-studio/tests/shared-publications.cjs'
      - 'comic-studio/worker.js'
      - 'comic-studio/personalize.js'
      - 'comic-studio/tests/service-worker-cache.cjs'
      - '.github/workflows/worldtoon-cache-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend syntax
        run: |
          node --check comic-studio/archive.js
          node --check comic-studio/sw.js
          node --check comic-studio/app.js
          node --check comic-studio/worker.js
          node --check comic-studio/personalize.js
      - name: Verify authenticated APIs bypass old service-worker cache
        run: node comic-studio/tests/service-worker-cache.cjs
      - name: Verify responsive Production Desk and live-status layout
        run: node comic-studio/tests/production-desk.cjs
      - name: Verify DeepSeek free character AI and deprecation safety
        run: node comic-studio/tests/character-deepseek.cjs
      - name: Verify shared WeChat publication matching and safety
        run: node comic-studio/tests/shared-publications.cjs
