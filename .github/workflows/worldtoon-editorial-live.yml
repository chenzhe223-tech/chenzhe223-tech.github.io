name: WorldToon editorial discovery live acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'comic-studio/tests/editorial-live.cjs'
      - '.github/workflows/worldtoon-editorial-live.yml'
permissions:
  contents: read
jobs:
  real-api-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Browser dependencies
        run: |
          npm install --no-save --no-audit playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Live public D1 catalogue, score distribution, all three real tabs
        run: node comic-studio/tests/editorial-live.cjs
