name: WORLD/TOON Literature V2 online release acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worldtoon-literature-release.yml'
permissions:
  contents: read
jobs:
  live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real production deployment, asset bytes and authenticated API boundaries
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const base='https://worldtoon.chenzhe223.workers.dev';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const files=['index.html','app.js','creative-director.js','extension.js','sw.js','novel-core.js','novel-studio.js','character-continuity.js'];
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path,opts={}){
            return fetch(base+path,{...opts,cache:'no-store',signal:AbortSignal.timeout(20000)});
          }
          let last;
          for(let attempt=1;attempt<=8;attempt++){
            try{
              const response=await get('/health');
              assert.equal(response.status,200);
              const health=await response.json();
              assert.equal(health.ok,true);
              assert.equal(health.features.literatureResearchV2,true);
              const results=await Promise.all(files.map(async file=>{
                const path=file==='index.html'?'/':'/'+file;
                const r=await get(path+'?release=5.6.0-literature-v2');
                assert.equal(r.status,200,file);
                const bytes=Buffer.from(await r.arrayBuffer());
                assert.equal(hash(bytes),hash(readFileSync('comic-studio/'+file)),file+' deployed source mismatch');
                return {file,status:r.status,sha256:hash(bytes)};
              }));
              const index=readFileSync('comic-studio/index.html','utf8');
              assert.ok(index.includes('5.6.0-literature-v2'));
              const unauthorized=await get('/api/archive/literary-sources',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:'synthetic release test'})});
              assert.equal(unauthorized.status,401);
              assert.match(unauthorized.headers.get('cache-control')||'',/no-store/);
              const model=await get('/api/archive/deepseek-expand',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:'literary_review',idea:'synthetic release test',panel_count:9})});
              assert.equal(model.status,401,'auth gate must block all upstream model calls');
              console.log(JSON.stringify({result:'PASS',site:base,health:{ok:health.ok,literatureResearchV2:health.features.literatureResearchV2},assets:results,authBoundary:401,paidModelCalls:0},null,2));
              process.exit(0);
            }catch(e){last=e;console.log('release verification attempt '+attempt+': '+e.message);if(attempt<8)await delay(8000)}
          }
          throw last;
          JS
