name: DAVYLAB Content Package QA

on:
  push:
    branches: [main]
    paths:
      - "topic-studio/content-pipeline/**"
      - "topic-studio/scripts/validate-content-package.mjs"
      - "topic-studio/scripts/test-content-package-validator.mjs"
      - ".github/workflows/validate-content-packages.yml"
  pull_request:
    paths:
      - "topic-studio/content-pipeline/**"
      - "topic-studio/scripts/validate-content-package.mjs"
      - ".github/workflows/validate-content-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-content-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test package validator
        run: node topic-studio/scripts/test-content-package-validator.mjs
      - name: Validate current queue and packages
        run: node topic-studio/scripts/validate-content-package.mjs
