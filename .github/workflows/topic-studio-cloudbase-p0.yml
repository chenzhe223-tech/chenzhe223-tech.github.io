name: Topic Studio - CloudBase Shanghai P0 safety checks

on:
  push:
    paths:
      - "topic-studio/cloudbase/**"
      - ".github/workflows/topic-studio-cloudbase-p0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source (no Tencent credentials)
        uses: actions/checkout@v4
      - name: Validate local migration and CloudBase access policy
        run: node topic-studio/cloudbase/test-p0.cjs
      - name: Verify offline-first backup, deterministic comparison and conflict blocking
        run: node topic-studio/cloudbase/test-sync-core.cjs
      - name: Verify P1 excess-tiglon PostgreSQL RLS and CAS RPC contracts
        run: node topic-studio/cloudbase/test-p1-pg.cjs
      - name: Confirm the sync center does not invoke network writes or user-data uploads
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('topic-studio/cloudbase/sync-center.html','utf8');if(!html.includes('sync-core.js')||!html.includes('CloudBase 尚未连接'))process.exit(1)"
      - name: Confirm no CloudBase deploy was attempted
        run: |
          echo "P0 source validation only."
          echo "No Tencent Cloud API credentials used."
          echo "No database or live user data changed."
