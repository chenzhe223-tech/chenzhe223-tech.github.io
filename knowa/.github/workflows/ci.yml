name: KNOWA P0 CI
on:
  push:
    paths: ['**/*.js', 'package.json', '.github/workflows/ci.yml']
  pull_request:
    paths: ['**/*.js', 'package.json', '.github/workflows/ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
