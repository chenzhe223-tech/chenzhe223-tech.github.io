function switchLang(next){langState.value=next;const nav={today:["今日","Today"],deep:["深读","Deep reads"],china:["发现","Discover"],tools:["知识库","Library"],archive:["我的","Saved"],back:["← 返回每日简报","← Back to briefing"]};document.querySelectorAll("[data-nav]").forEach(n=>{const pair=nav[n.dataset.nav];if(pair)n.textContent=pair[next==="en"?1:0]});document.querySelectorAll("[data-nav=deep]").forEach(n=>n.href=location.href);$("zh").classList.toggle("active",next==="zh");$("en").classList.toggle("active",next==="en");document.documentElement.lang=next==="zh"?"zh-CN":"en";if(window.briefData)render(window.briefData,window.storyList);refreshReaderControlLabels()}

const savedReadKey="davy-radar-deep-read:"+type+":"+(safeDate||"latest")+":"+id;
function syncReaderBookmark(){
 const button=$("readerBookmarkAction");if(!button)return;
 let saved=false;
 try{const current=JSON.parse(localStorage.getItem("davy-radar.saved-deep-reads.v1")||"[]");saved=Array.isArray(current)&&current.includes(savedReadKey)}catch{}
 button.setAttribute("aria-pressed",String(saved));
 const desktop=$("deskBookmark");
 if(desktop){desktop.setAttribute("aria-pressed",String(saved));desktop.textContent=saved?"♥":"♡";}
 $("readerBookmarkLabel").textContent=saved?text("已收藏","Saved"):text("收藏","Save");
}
function refreshReaderControlLabels(){
 const size=document.body.dataset.readerSize||"normal";
 $("readerFontLabel").textContent=size==="normal"?text("字号","Text size"):size==="large"?text("字号＋","Text size +"):text("字号＋＋","Text size ++");
 $("readerShareLabel").textContent=text("分享","Share");
 syncReaderBookmark();
}
$("readerFontSize").onclick=()=>{
 const order=["normal","large","larger"],current=document.body.dataset.readerSize||"normal";
 const next=order[(order.indexOf(current)+1)%order.length];document.body.dataset.readerSize=next;
 $("readerFontSize").setAttribute("aria-pressed",String(next!=="normal"));
 $("readerFontLabel").textContent=next==="normal"?text("字号","Text size"):next==="large"?text("字号＋","Text size +"):text("字号＋＋","Text size ++");
};
$("readerBookmarkAction").onclick=()=>{
 try{
  let current=JSON.parse(localStorage.getItem("davy-radar.saved-deep-reads.v1")||"[]");
  if(!Array.isArray(current))current=[];
  current=current.filter(value=>typeof value==="string");
  const existing=current.includes(savedReadKey);
  current=existing?current.filter(value=>value!==savedReadKey):[...current,savedReadKey].slice(-200);
  localStorage.setItem("davy-radar.saved-deep-reads.v1",JSON.stringify(current));
  syncReaderBookmark();
  showToast(existing?text("已取消收藏","Removed from saved reads"):text("已加入收藏","Saved for later"));
 }catch{showToast(text("本机存储不可用，未保存。","Local storage is unavailable; nothing was saved."))}
};
$("readerShareAction").onclick=async()=>{
 let copied=false;
 try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(location.href);copied=true}}catch{}
 if(!copied){const field=document.createElement("textarea");field.value=location.href;field.setAttribute("readonly","");field.style.position="fixed";field.style.opacity="0";document.body.appendChild(field);field.select();try{copied=document.execCommand("copy")}catch{}field.remove()}
 showToast(copied?text("链接已复制","Link copied"):text("请手动复制地址栏链接。","Copy the address bar link."));
};
syncReaderBookmark();

$("zh").onclick=()=>switchLang("zh");$("en").onclick=()=>switchLang("en");
document.querySelectorAll("[data-nav=deep]").forEach(n=>n.href=location.href);
fetch(dataUrl+"?ts="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Briefing unavailable");return r.json()}).then(d=>{window.briefData=d;const key={top5:"top5",xnews:"xnews_voices",china:"china_ai_news",news:"news"}[type]||"top5";window.storyList=d[key]||[];render(d,window.storyList)}).catch(()=>{$("content").innerHTML='<div class="eyebrow">DAVYLAB AI RADAR · DEEP READ</div><div class="empty">'+text("无法读取这期日报。请回到首页并重新选择。","Could not load this briefing. Return to the homepage and choose a story again.")+'</div>'});
})();
</script>
