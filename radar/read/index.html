<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4ef"><link rel="stylesheet" href="../assets/design-system.css">
<title>深度阅读 · DAVYLAB AI Radar</title>
<style>
:root{--wide:var(--page-width)}
*{box-sizing:border-box}html{background:var(--paper);scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}a:hover{color:var(--accent)}button{font:inherit}.wrap{width:min(var(--wide),calc(100% - 56px));margin:auto}.masthead{display:flex;align-items:center;gap:28px;min-height:76px;border-bottom:1px solid var(--rule)}.brand{font-size:17px;font-weight:800;letter-spacing:-.045em;white-space:nowrap}.brand span{color:var(--accent)}.nav{display:flex;gap:24px;margin-left:auto;font-size:12px;color:#596a7d}.nav a:first-child,.nav a[data-nav="deep"]{color:var(--ink)}.lang{display:flex;gap:2px;border:1px solid #ccd4dc;background:white;padding:2px}.lang button{border:0;background:none;color:#54677a;padding:5px 9px;font-size:10px;cursor:pointer}.lang button.active{background:#1c3554;color:white}.crumb{display:flex;gap:10px;align-items:center;margin:20px 0 28px;color:#6e7b8a;font-size:11px}.crumb a{text-decoration:underline;text-underline-offset:3px;color:#315f83}.eyebrow{font:11px/1.5 var(--serif);letter-spacing:.14em;text-transform:uppercase;color:#59708a}.layout{display:grid;grid-template-columns:minmax(0,790px) minmax(210px,1fr);gap:clamp(30px,6vw,82px);align-items:start}.story{min-width:0}.category{display:inline-block;margin:12px 0;color:#38638a;font-size:11px;letter-spacing:.04em}.title{margin:6px 0 22px;font-size:clamp(36px,5.1vw,62px);font-weight:680;letter-spacing:-.055em;line-height:1.16;text-wrap:pretty}.dek{font-size:19px;line-height:1.72;color:#4b5c70;max-width:740px}.cover{width:100%;aspect-ratio:16/8.3;object-fit:cover;margin:30px 0 16px;background:#e6e7e4}.caption{font-size:10px;color:#798493;margin:0 0 34px}.provenance{display:flex;flex-wrap:wrap;gap:10px 18px;padding:15px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:11px;color:#687589}.provenance strong{color:#263c56;font-weight:650}.section{padding:30px 0;border-bottom:1px solid var(--rule)}.section h2{font-size:22px;letter-spacing:-.04em;margin:0 0 12px}.section p{white-space:pre-wrap;color:#46566a;margin:0;font-size:15px}.judgment{border-left:2px solid var(--accent);padding-left:17px}.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:16px 0}.score{border-top:2px solid #9aafc1;padding-top:8px}.score b{font:22px var(--serif);color:#254e71}.score span{display:block;color:#758191;font-size:10px;line-height:1.45}.rail{position:sticky;top:25px;border-top:2px solid var(--accent);padding-top:13px}.rail h2{font:14px var(--serif);letter-spacing:.08em;margin:0 0 16px}.rail p,.rail li{font-size:11px;line-height:1.8;color:#657386}.rail ul{padding-left:16px}.rail-links{display:grid;gap:8px;margin:19px 0}.rail-links a,.action{display:flex;justify-content:center;align-items:center;border:1px solid #c5ced8;background:transparent;padding:9px 12px;font-size:11px;color:#274760;text-align:center}.rail-links a.primary,.action.primary{background:#1e3b5e;color:white;border-color:#1e3b5e}.notice{margin:17px 0;padding:12px;border:1px solid #d5dbe1;background:#efeee8;color:#5e6b7a;font-size:10px;line-height:1.7}.notice[hidden]{display:none}.footer{border-top:1px solid var(--rule);margin-top:60px;padding:24px 0 40px;font-size:10px;color:#748191}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 15px;background:#1c3554;color:white;font-size:11px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}.empty{margin:30px 0;padding:28px 0;border-top:1px solid var(--rule);font-size:14px;color:#637184}
.mobile-dock{display:none}
@media(max-width:760px){.wrap{width:calc(100% - 36px)}.masthead{min-height:60px;gap:12px}.brand{font-size:14px}.nav{display:none}.layout{display:block}.title{font-size:clamp(34px,9vw,46px);margin-top:4px}.dek{font-size:16px}.cover{aspect-ratio:16/10;margin:22px 0 12px}.rail{position:static;margin-top:30px}.rail-links{grid-template-columns:1fr 1fr}.scores{gap:7px}.score b{font-size:18px}.score span{font-size:9px}.section{padding:24px 0}.section h2{font-size:20px}.section p{font-size:14px}.footer{margin-top:38px}.crumb{margin:15px 0 22px}.mobile-dock{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:9px max(8px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom));background:rgba(248,247,243,.97);border-top:1px solid var(--rule);backdrop-filter:blur(14px)}.mobile-dock a{display:flex;justify-content:center;align-items:center;min-height:36px;color:#58697d;font-size:9px;text-align:center;line-height:1.3}.mobile-dock a[data-nav="deep"]{color:var(--accent);font-weight:700}body{padding-bottom:68px}}
@media(max-width:390px){.wrap{width:calc(100% - 28px)}.title{font-size:34px}.scores{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="masthead"><a class="brand" href="../daily/">AI <span>前沿简报</span> <small style="font-weight:500;color:#7b8798"> / DAVYLAB</small></a><nav class="nav" aria-label="栏目导航"><a id="navToday" href="../daily/" data-nav="today">今日简报</a><a id="navDeep" href="../daily/#ai" data-nav="deep">深度阅读</a><a id="navChina" href="../daily/#chinaAI" data-nav="china">中国 AI</a><a id="navTools" href="../daily/#skills" data-nav="tools">研究与工具</a><a id="navArchive" href="../daily/#archiveDate" data-nav="archive">历史简报</a></nav><div class="lang" role="group" aria-label="语言"><button class="active" id="zh">中文</button><button id="en">EN</button></div></header>
<div class="crumb"><a id="backBrief" href="../daily/" data-nav="back">← 返回每日简报</a><span>/</span><span id="crumbType">深度阅读</span></div>
<main id="content"><div class="eyebrow">DAVYLAB AI RADAR · DEEP READ</div><div class="empty" role="status">正在读取这篇情报…</div></main>
<footer class="footer">Davy Radar · 看见趋势，发现机会。<span id="footerDate" style="float:right"></span></footer>
</div><nav class="mobile-dock" aria-label="移动端主导航"><a id="dockToday" href="../daily/" data-nav="today">今日简报</a><a id="dockDeep" href="../daily/#ai" data-nav="deep">深度阅读</a><a id="dockChina" href="../daily/#chinaAI" data-nav="china">中国 AI</a><a id="dockTools" href="../daily/#skills" data-nav="tools">研究与工具</a><a id="dockArchive" href="../daily/#archiveDate" data-nav="archive">历史简报</a></nav><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
const q=new URLSearchParams(location.search),type=q.get("type")||"top5",id=Number.parseInt(q.get("id")||"0",10),date=q.get("date")||"",langState={value:"zh"};
const safeDate=/^\d{4}-\d{2}-\d{2}$/.test(date)?date:"",dataUrl=safeDate?"../data/archive/"+encodeURIComponent(safeDate)+".json":"../data/latest.json";
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id),isEn=()=>langState.value==="en",text=(zh,en)=>isEn()?en:zh;
const labels={innovation:["创新性","Innovation"],practicality:["实用性","Practicality"],feasibility:["可行性","Feasibility"],impact:["影响力","Impact"],opportunity:["机会价值","Opportunity"]};
function showToast(s){const n=$("toast");n.textContent=s;n.classList.add("show");setTimeout(()=>n.classList.remove("show"),2200)}
function section(title,value,cls=""){return value?'<section class="section '+cls+'"><h2>'+esc(title)+'</h2><p>'+esc(value)+'</p></section>':''}
function scoreBlock(scores){if(!scores||typeof scores!=="object")return"";return '<section class="section"><h2>'+text("五维判断 · 供参考","Five dimensions · For reference")+'</h2><div class="scores">'+Object.keys(labels).filter(k=>Number.isFinite(Number(scores[k]))).map(k=>'<div class="score"><b>'+esc(scores[k])+'</b><span>'+esc(labels[k][isEn()?1:0])+'</span></div>').join("")+'</div></section>'}
function render(d,items){const story=(items||[])[id];if(!story){$("content").innerHTML='<div class="eyebrow">DAVYLAB AI RADAR · DEEP READ</div><div class="empty">'+text("这期简报里暂时没有这篇深读内容。请返回每日简报选择一条真实情报。","This briefing does not contain that deep-read item. Return to the daily briefing and select a story.")+'</div>';return}
 const x=story,xnews=type==="xnews",name=isEn()?(x.title_en||x.title||x.original_title):(x.title_zh||x.title||x.original_title),category=isEn()?(x.category_en||x.source||"AI Intelligence"):(x.category_zh||x.category||x.source||"AI 情报");
 const source=x.source_url||x.url||"",curated=x.curated_url||"",sourceSafe=/^https:\/\//i.test(source)?source:"",curatedSafe=/^https:\/\/xnews\.qiaomu\.ai\//i.test(curated)?curated:"";
 const what=isEn()?(x.what_en||x.summary_en||x.summary||""):(x.what_zh||x.summary_zh||x.summary||"");
 const why=isEn()?(x.why_en||x.why_it_matters_en||""):(x.why_zh||x.why_it_matters_zh||"");
 const judgment=isEn()?(x.editor_judgment_en||""):(x.editor_judgment_zh||"");
 const risk=isEn()?(x.opportunity_risk_en||""):(x.opportunity_risk_zh||"");
 const action=isEn()?(x.action_en||""):(x.action_zh||"");
 const summary=isEn()?(x.summary_en||x.summary||x.what_en||""):(x.summary_zh||x.summary||x.what_zh||"");
 const published=x.published?new Date(x.published).toLocaleString(isEn()?"en-US":"zh-CN",{dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Shanghai"}):text("时间未核实","Publication time unavailable");
 const image=/^https:\/\//i.test(x.image_url||"")?x.image_url:"";
 const evidence=x.confidence?text("判断把握：","Confidence: ")+({low:text("低 · 待独立验证","Low · verify independently"),medium:text("中","Medium"),high:text("高","High")}[String(x.confidence).toLowerCase()]||esc(x.confidence)):"";
 const notice=xnews?text("该内容来自 X News 的二次编辑整理；此页面展示已收录的摘要，不代表 DAVYLAB 对原文主张作出独立核验。","This item is an X News editorial summary. This page presents the collected summary; DAVYLAB has not independently verified the source claims."):text("摘要、编辑判断与行动提示均来自该期日报数据。涉及厂商自述或媒体转述的数字，请以原始来源和独立验证为准。","Summary, editorial judgment and next steps are drawn from this briefing. Verify vendor claims and reported figures against the original source.");
 $("crumbType").textContent=text("深度阅读","Deep read");$("footerDate").textContent=d.report_date||"";
 document.title=esc(name)+" · 深度阅读 · DAVYLAB";
 $("content").innerHTML='<div class="eyebrow">'+(xnews?"X NEWS · DAVYLAB DEEP READ":"DAVYLAB AI RADAR · DEEP READ")+'</div><span class="category">'+esc(category)+'</span><div class="layout"><article class="story"><h1 class="title">'+esc(name||"AI 情报")+'</h1><p class="dek">'+esc(summary||what||text("本条日报未提供摘要，请打开原始来源阅读。","No summary was included in this briefing. Open the original source for details."))+'</p>'+(image?'<img class="cover" src="'+esc(image)+'" alt="'+esc(x.image_alt||name)+'" loading="eager">'+(x.image_alt?'<p class="caption">'+esc(x.image_alt)+'</p>':''):'')+'<div class="provenance"><span><strong>'+text("来源","Source")+'</strong> · '+esc(x.source||"AI Radar")+'</span><span><strong>'+text("发布时间","Published")+'</strong> · '+esc(published)+'</span>'+(evidence?'<span><strong>'+esc(evidence)+'</strong></span>':'')+'</div>'+section(text("发生了什么","What happened"),what)+section(text("为什么值得关注","Why it matters"),why)+section(text("编辑判断","Editorial judgment"),judgment,"judgment")+section(text("机会与风险","Opportunity and risk"),risk)+section(text("可以继续做什么","A next step"),action)+scoreBlock(x.scores)+'</article><aside class="rail"><h2>'+text("阅读说明","READING NOTES")+'</h2><p>'+esc(notice)+'</p><div class="notice" '+(xnews?"":"hidden")+'>'+esc(text("X News 中文编辑链接保留在下方，原文请优先查阅。","The X News editorial link is retained below; consult the original source first."))+'</div><div class="rail-links">'+(sourceSafe?'<a class="primary" href="'+esc(sourceSafe)+'" target="_blank" rel="noopener noreferrer">'+text("打开原始来源 ↗","Open original source ↗")+'</a>':'')+(curatedSafe?'<a href="'+esc(curatedSafe)+'" target="_blank" rel="noopener noreferrer">'+text("X News 中文解读 ↗","X News editorial ↗")+'</a>':'')+'<button class="action" id="share">'+text("复制本页链接","Copy this page link")+'</button><a href="../daily/'+(safeDate?"?date="+encodeURIComponent(safeDate):"")+'">'+text("回到本期简报","Return to this briefing")+'</a></div><p>'+text("归档日期","Archive date")+' · '+esc(d.report_date||"—")+'</p></aside></div>';
 const share=$("share");if(share)share.onclick=async()=>{try{await navigator.clipboard.writeText(location.href);showToast(text("链接已复制","Link copied"))}catch{showToast(text("无法访问剪贴板，请手动复制地址栏链接。","Clipboard unavailable. Copy the address bar link."))}};
}
function switchLang(next){langState.value=next;const nav={today:["今日简报","Today"],deep:["深度阅读","Deep reads"],china:["中国 AI","China AI"],tools:["研究与工具","Research & tools"],archive:["历史简报","Archive"],back:["← 返回每日简报","← Back to briefing"]};document.querySelectorAll("[data-nav]").forEach(n=>{const pair=nav[n.dataset.nav];if(pair)n.textContent=pair[next==="en"?1:0]});document.querySelectorAll("[data-nav=deep]").forEach(n=>n.href=location.href);$("zh").classList.toggle("active",next==="zh");$("en").classList.toggle("active",next==="en");document.documentElement.lang=next==="zh"?"zh-CN":"en";if(window.briefData)render(window.briefData,window.storyList)}
$("zh").onclick=()=>switchLang("zh");$("en").onclick=()=>switchLang("en");
document.querySelectorAll("[data-nav=deep]").forEach(n=>n.href=location.href);
fetch(dataUrl+"?ts="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Briefing unavailable");return r.json()}).then(d=>{window.briefData=d;const key={top5:"top5",xnews:"xnews_voices",china:"china_ai_news",news:"news"}[type]||"top5";window.storyList=d[key]||[];render(d,window.storyList)}).catch(()=>{$("content").innerHTML='<div class="eyebrow">DAVYLAB AI RADAR · DEEP READ</div><div class="empty">'+text("无法读取这期日报。请回到首页并重新选择。","Could not load this briefing. Return to the homepage and choose a story again.")+'</div>'});
})();
</script>
</body></html>
